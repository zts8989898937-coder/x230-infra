name: webapps

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  # ---------- 开发 / 学习 ----------
  jupyter:
    <<: *common
    image: docker.1ms.run/jupyter/scipy-notebook:latest
    container_name: jupyter
    ports:
      - "100.110.77.111:3888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      JUPYTER_ENABLE_LAB: "yes"
      TZ: Asia/Shanghai
    volumes:
      - ./data/jupyter:/home/jovyan/work

  # ---------- 文件 ----------
  filebrowser:
    <<: *common
    image: docker.1ms.run/filebrowser/filebrowser:v2
    container_name: filebrowser
    command: ["-r", "/srv", "-d", "/database/filebrowser.db", "-a", "0.0.0.0", "-p", "80"]
    ports:
      - "100.110.77.111:3889:80"
    volumes:
      - /home/zts:/srv
      - ./data/filebrowser:/database

  alist:
    <<: *common
    image: docker.1ms.run/xhofe/alist:latest
    container_name: alist
    ports:
      - "100.110.77.111:3890:5244"
    volumes:
      - ./data/alist:/opt/alist/data
      - /:/host:ro                      # 本机整盘只读（2026-11-13 按用户要求）

  # ---------- 文档 ----------
  stirling:
    <<: *common
    image: docker.1ms.run/stirlingtools/stirling-pdf:latest
    container_name: stirling
    ports:
      - "100.110.77.111:3891:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./data/stirling:/configs
      - ./data/stirling-tmp:/tmp

  # ---------- 笔记 / 信息 ----------
  memos:
    <<: *common
    image: docker.1ms.run/neosmemo/memos:stable
    container_name: memos
    ports:
      - "100.110.77.111:3892:5230"
    volumes:
      - ./data/memos:/var/opt/memos

  miniflux:
    <<: *common
    image: docker.1ms.run/miniflux/miniflux:latest
    container_name: miniflux
    depends_on:
      miniflux-db:
        condition: service_healthy
    ports:
      - "100.110.77.111:3894:8080"
    environment:
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASS}@miniflux-db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: zts
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASS}
      BASE_URL: https://rss.156-239-8-225.sslip.io/

  miniflux-db:
    <<: *common
    image: docker.1ms.run/library/postgres:16-alpine
    container_name: miniflux-db
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASS}
      POSTGRES_DB: miniflux
    volumes:
      - ./data/miniflux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- 代码托管 ----------
  gitea:
    <<: *common
    image: docker.1ms.run/gitea/gitea:1
    container_name: gitea
    ports:
      - "100.110.77.111:3895:3000"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: Asia/Shanghai
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://100.110.77.111:3895/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - ./data/gitea:/data

  # ---------- 媒体 ----------
  navidrome:
    <<: *common
    image: docker.1ms.run/deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "100.110.77.111:3896:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: 1h
      ND_SCANNER_PURGEMISSING: "always"
      ND_LOGLEVEL: info
      ND_DEFAULTADMINPASSWORD: <REDACTED>
      TZ: Asia/Shanghai
    volumes:
      - /home/zts/Music:/music:ro
      - ./data/navidrome:/data

  jellyfin:
    <<: *common
    image: docker.1ms.run/jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "100.110.77.111:3897:8096"
    environment:
      TZ: Asia/Shanghai
      JELLYFIN_PublishedServerUrl: http://100.110.77.111:3897
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - /home/zts/Videos:/media:ro

  # ---------- 画图 ----------
  excalidraw:
    <<: *common
    image: docker.1ms.run/excalidraw/excalidraw:latest
    container_name: excalidraw
    ports:
      - "100.110.77.111:3898:80"

  drawio:
    <<: *common
    image: docker.1ms.run/jgraph/drawio:latest
    container_name: drawio
    ports:
      - "100.110.77.111:3900:8080"

  # ---------- 监控 ----------
  uptime-kuma:
    <<: *common
    image: docker.1ms.run/louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "100.110.77.111:3893:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
