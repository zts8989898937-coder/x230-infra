[global]
   workgroup = WORKGROUP
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 1000
   load printers = no
   printcap name = /dev/null
   disable spoolss = yes

[agent]
   comment = X230 Agent Workspace
   path = /home/zts/agent-share
   browseable = yes
   read only = no
   valid users = zts
   create mask = 0644
   directory mask = 0755
