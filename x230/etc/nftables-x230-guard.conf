#!/usr/sbin/nft -f
table inet x230_guard
flush table inet x230_guard

table inet x230_guard {
  chain input {
    type filter hook input priority 5; policy accept;
    iifname { "lo", "tailscale0", "wg0", "docker0", "br-*" } accept
    ip saddr { 127.0.0.0/8, 192.168.8.0/24, 172.16.0.0/12, 100.64.0.0/10, 10.66.0.0/24 } accept
    ct state { established, related } accept
    tcp dport { 3080, 3081, 3082, 3901, 3902, 3903, 8443, 8444, 8898, 8899, 8900, 19999, 2586, 139, 445 } drop
  }
}
