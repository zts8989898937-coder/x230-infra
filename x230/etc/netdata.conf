# netdata configuration - tuned for headless X230 server (2026-10-30)
[global]
	update every = 2

[ml]
	enabled = no

[plugins]
	cups = no
	systemd-units = no
	systemd-journal = no
	apps = no
	cgroups = no
	ebpf = no
	ebpf-go = no
	statsd = no
	nfacct = no
	network-viewer = no
	python.d = no
	charts.d = no
	scripts.d = no
	go.d = no
	tc = no

[web]
	bind to = 127.0.0.1 100.110.77.111 192.168.8.120
	allow connections from = localhost 127.* 100.* 192.168.8.*
