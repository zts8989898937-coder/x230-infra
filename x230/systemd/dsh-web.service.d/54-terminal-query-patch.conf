# 2026-11-11 侧边栏终端不再丢弃终端查询应答（fish DA1 警告）
#
# dsh-api-terminal-controller 用 @xterm/headless 在宿主侧维护屏幕，只把 serialize()
# 快照发给浏览器；headless 模拟器的 onData 应答（DA1 -> ESC[?1;2c、DSR 等）没有任何
# 订阅者，于是被丢掉、从未写回 PTY。fish 等 10 秒拿不到 DA1 应答就告警并关掉可选
# 终端功能。补丁在 BrowserTerminal 构造函数里订阅 onData 并写回 PTY（真终端的行为）。
#
# npm 升级/每日滚包会覆盖 lib/index.js，所以放 ExecStartPre 里幂等重打；前缀 -
# 表示失败不阻塞启动。自测：__selftest_terminal.mjs 里喂 ESC[0c + ESC[6n，
# 断言 PTY 收到 ESC[?1;2c 与 ESC[1;1R。
[Service]
ExecStartPre=-/usr/local/bin/dsh-terminal-query-patch --quiet
