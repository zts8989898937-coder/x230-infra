# 2026-11-07 技能中心「加载失败：forbidden: loopback-only」根治
#
# @linxin666/dsh-client-ui-skill-explorer 把 /api/dsh-skill-explorer/* 全部锁死在
# 回环（socket 地址 + Host 头 + 无转发头三者同时满足）。本机 GUI 走
# http://192.168.8.120:3082 → dsh-web-lan.socket → socket proxy → 100.110.77.111:3080，
# 局域网浏览器永远不在回环，于是整页 403，只有「刷新」按钮。
#
# 补丁把围栏多接一条允许路径：宿主自己的 connection 服务（requestRejection，
# 即 trustedHosts + dsh 登录 cookie），与 GUI 里其它所有已认证路由同一道闸；
# 查不到服务/抛错/被拒一律维持 403。npm 升级会覆盖 lib/index.js（今天 10:50 就是
# 这么又坏一次），所以放在 ExecStartPre 里幂等重打；前缀 - 表示失败不阻塞启动。
[Service]
ExecStartPre=-/usr/local/bin/dsh-skill-explorer-lan-trust-patch --quiet
