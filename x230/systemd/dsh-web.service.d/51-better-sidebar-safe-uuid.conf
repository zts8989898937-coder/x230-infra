# 2026-11-08 右侧「侧边对话(beta)」点开是空白（局域网 http 非安全上下文）
#
# dsh-better-sidebar 0.30.1 的 createTab 直接调 crypto.randomUUID()：
#   lib/client.js:28618  id: `sidechat:new-${crypto.randomUUID()}`
#   lib/client.js:28644  id: `terminal-bottom:${crypto.randomUUID()}`
#   lib/client.js:28647  meta: { [INSTANCE_FIELD]: crypto.randomUUID() }
# crypto.randomUUID 只在安全上下文（https / localhost）存在；从
# http://192.168.8.120:3082 访问时它是 undefined，点「侧边对话」即在 createTab
# 抛 TypeError，右侧 pane 崩成空白（底部终端同样会崩）。
# 补丁换成带降级的 __dshSafeUUID()（宿主 dsh-util-crypto 也是同样的思路）。
# npm 升级 dsh-better-sidebar 会覆盖 lib/client.js，所以放在 ExecStartPre 幂等重打；
# 前缀 - 表示失败不阻塞启动。
[Service]
ExecStartPre=-/usr/local/bin/dsh-better-sidebar-safe-uuid --quiet
