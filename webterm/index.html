<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X230 工作台</title>
<meta name="wt-release" content="20261116.2">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CjxyZWN0IHg9IjIuNSIgeT0iNC41IiB3aWR0aD0iMjciIGhlaWdodD0iMjMiIHJ4PSI0LjUiIGZpbGw9IiMwYzEyMTAiIHN0cm9rZT0iIzNlY2Y4ZSIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxwYXRoIGQ9Ik04LjUgMTEuNWw0LjIgNC4yLTQuMiA0LjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2VhZmZmNCIgc3Ryb2tlLXdpZHRoPSIyLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8cmVjdCB4PSIxNiIgeT0iMTkuMiIgd2lkdGg9IjgiIGhlaWdodD0iMi42IiByeD0iMS4zIiBmaWxsPSIjM2VjZjhlIi8+Cjwvc3ZnPg==">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<style>
  :root{
    --bg:#0a0a0c;
    --bar:rgba(10,10,12,0.88);
    --surface:rgba(241,236,227,0.055);
    --surface-hover:rgba(241,236,227,0.095);
    --line:rgba(241,236,227,0.13);
    --line-soft:rgba(241,236,227,0.075);
    --line-strong:rgba(241,236,227,0.24);
    --ink:#f1ece3;
    --ink-dim:rgba(241,236,227,0.72);
    --muted:rgba(241,236,227,0.48);
    --accent:#ee9833;
    --ember:#d26a4c;
    --gold:#cbb38f;
    --accent2:#83b8ca;
    --ok:#98b88c;
    --warn:#ee9833;
    --crit:#e2708f;
    --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:12.5px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(238,152,51,0.3);color:var(--ink)}
  #bg-wall{position:fixed;inset:0;background-color:var(--bg);background-size:cover;background-position:right center;background-repeat:no-repeat;opacity:.30;filter:saturate(.9) contrast(1.03);pointer-events:none;z-index:0;contain:strict;transition:opacity .22s ease}
  #bg-wall.off{display:none}
  #bg-wall-blur{display:none;position:fixed;inset:-32px;background-color:#0a0a0c;background-size:cover;background-position:center center;background-repeat:no-repeat;filter:blur(44px) saturate(1.1) brightness(.26);pointer-events:none;z-index:0;contain:strict}
  #bg-vignette{position:fixed;inset:0;background:radial-gradient(ellipse at 74% 38%,rgba(131,184,202,.06),transparent 46%),radial-gradient(ellipse 80% 42% at 50% 0%,rgba(203,179,143,.04),transparent 70%),linear-gradient(95deg,rgba(10,10,12,.92) 0%,rgba(10,10,12,.75) 50%,rgba(10,10,12,.52) 100%);pointer-events:none;z-index:1;contain:strict;transition:opacity .22s ease}
  #app{display:flex;flex-direction:column;height:100%;position:relative;z-index:2}

  /* 顶部工作栏（呼应 Still Floating 入口日蚀标记与黑曜石极简线框） */
  #bar{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:20;transition:opacity .2s ease,transform .2s ease}
  .sf-mark{width:8px;height:8px;border:1px solid var(--ink);border-radius:50%;box-shadow:inset 3px 0 0 var(--accent);flex:0 0 auto;margin-right:2px;opacity:.9}
  #wall-exit{display:none;position:fixed;right:14px;bottom:14px;z-index:30;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(10,10,12,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font:12px/1 var(--ui);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.48);opacity:.82;transition:opacity .16s ease,border-color .16s ease,background .16s ease}
  #wall-exit:hover{opacity:1;background:rgba(16,16,20,.88);border-color:rgba(238,152,51,.55);color:#fff}
  #wall-exit svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
  #wall-exit .hint{color:var(--muted);font:11px/1 var(--mono)}

  body.wall-peek #bg-wall{opacity:1;filter:none;background-color:#0a0a0c;background-size:cover;background-position:75% center;pointer-events:auto;cursor:zoom-out}
  body.wall-peek #bg-vignette{opacity:0}
  body.wall-peek #app{pointer-events:none}
  body.wall-peek #stage{opacity:0}
  body.wall-peek #bar{opacity:0;transform:translateY(-100%)}
  body.wall-peek #wall-exit{display:inline-flex}
  @media (max-aspect-ratio: 6/5), (min-aspect-ratio: 19/9){
    body.wall-peek #bg-wall-blur{display:block}
    body.wall-peek #bg-wall{background-color:transparent;background-size:contain;background-position:center center}
  }
  #tabs-wrap{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}
  #tabs-wrap::-webkit-scrollbar{display:none}
  #tablist{display:flex;align-items:center;gap:4px}

  .tab{display:inline-flex;align-items:center;gap:7px;height:25px;padding:0 9px;border:1px solid transparent;border-radius:4px;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;transition:background .14s,color .14s,border-color .14s;font-weight:500}
  .tab:hover{color:var(--ink);background:var(--surface)}
  .tab.active{color:var(--ink);background:var(--surface);border-color:rgba(238,152,51,0.42)}
  .tab .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55;flex:0 0 auto}
  .tab.active .dot{background:var(--accent);opacity:1;box-shadow:0 0 8px rgba(238,152,51,.7)}
  .tab .tname{max-width:110px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
  .tab .x{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;opacity:0;font-size:13px;line-height:1;color:var(--muted);transition:opacity .12s,background .12s,color .12s}
  .tab:hover .x,.tab.active .x{opacity:.55}
  .tab .x:hover{opacity:1;color:var(--crit);background:rgba(226,112,143,.14)}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:25px;padding:0 7px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:4px;cursor:pointer;font:inherit;transition:background .14s,color .14s,border-color .14s;flex:0 0 auto}
  .icon-btn:hover:not(:disabled){color:var(--ink);background:var(--surface);border-color:var(--line)}
  .icon-btn:active:not(:disabled){transform:translateY(.5px)}
  .icon-btn:disabled{opacity:.28;cursor:default}
  .icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
  #add{width:25px;padding:0}

  .sep{width:1px;height:14px;background:var(--line);flex:0 0 auto}

  /* 硬件状态胶囊 & 详情浮层 */
  #quota-pill{display:inline-flex;align-items:center;gap:8px;height:25px;padding:0 9px;background:rgba(241,236,227,0.025);border:1px solid var(--line);border-radius:4px;color:var(--muted);cursor:pointer;font:11px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap;flex:0 0 auto;transition:background .14s,border-color .14s,color .14s}
  #quota-pill:hover,#quota-pill.open{background:var(--surface);border-color:rgba(238,152,51,.42);color:var(--ink)}
  .qchip{display:inline-flex;align-items:center;gap:4px}
  .qdot{width:5px;height:5px;border-radius:50%;background:var(--muted)}
  .qdot.ok{background:var(--ok)}.qdot.warn{background:var(--warn)}.qdot.crit{background:var(--crit)}
  .qsep{color:rgba(241,236,227,0.16)}
  #quota-mobile-lbl{display:none}

  #quota-pop{position:fixed;top:44px;right:10px;width:368px;max-width:calc(100vw - 20px);max-height:calc(100vh - 58px);overflow-y:auto;background:#0e0e11;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 18px 48px rgba(0,0,0,0.62);padding:12px;z-index:100;display:none}
  #quota-pop.open{display:block}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .qtitle{font-weight:600;color:var(--ink);font-size:12.5px}
  .qmeta{font:11px/1.2 var(--mono);color:var(--muted)}
  .qgrid{display:flex;flex-direction:column;gap:8px}
  .qcard{background:rgba(241,236,227,0.025);border:1px solid var(--line);border-radius:5px;padding:9px 10px}
  .qcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .qcard-name{font-weight:600;color:var(--ink);font-size:12px}
  .qcard-plan{font:11px/1 var(--mono);color:var(--muted)}
  .qrow{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .qrow:first-of-type{margin-top:0}
  .qrow-line{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;gap:8px}
  .qrow-lbl{color:var(--ink-dim)}
  .qrow-val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  .qrow-reset{font:10.5px/1.2 var(--mono);color:var(--muted)}
  .qbar{height:3px;border-radius:99px;background:rgba(241,236,227,0.08);overflow:hidden}
  .qbar > i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .25s ease}
  .qbar > i.warn{background:var(--warn)}
  .qbar > i.crit{background:var(--crit)}
  .qerr{color:var(--crit);font-size:11.5px}

  #acts{display:flex;align-items:center;gap:2px;flex:0 0 auto}

  /* 舞台与扁平绝对定位窗格 */
  #stage{flex:1 1 auto;position:relative;min-height:0;background:transparent;overflow:hidden;transition:opacity .18s ease}
  .pane{position:absolute;background:transparent;display:none;overflow:hidden;contain:layout style paint}
  .pane.on{display:block}
  .pane::before{content:"";position:absolute;top:0;left:0;right:0;height:1.5px;background:transparent;pointer-events:none;z-index:5;transition:background .12s}
  #stage.multi .pane.on.focused::before{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .pane iframe{width:100%;height:100%;border:0;display:block;background:transparent}
  .pane.hist-active > iframe{opacity:0;pointer-events:none}

  .pane-move{display:none;position:absolute;inset:0 0 auto;height:25px;z-index:40;border:0;border-bottom:1px solid var(--line-soft);background:rgba(10,10,12,.75);color:var(--muted);font:11px/1 var(--ui);text-align:left;padding:0 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage.multi .pane-move{display:inline-flex;align-items:center;justify-content:center;gap:4px;inset:5px auto auto 6px;width:76px;height:24px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:rgba(16,16,20,.82);white-space:nowrap}
  #stage.multi .pane:not(.hist-active) .pane-move{inset:6px 8px auto auto;width:78px;height:24px}
  #stage.multi .pane > iframe{position:absolute;top:0;height:100%}
  #stage.multi .pane > .pane-hist{top:0;height:100%}
  #stage.multi .pane.hist-active .hist-title{margin-left:80px}
  .pane-move:hover,.pane-move:focus-visible{color:var(--ink);background:rgba(238,152,51,.12);border-color:rgba(238,152,51,.48)}
  body.moving-pane,body.moving-pane .pane-move{cursor:grabbing}
  body.moving-pane iframe{pointer-events:none}
  .pane.swap-source{opacity:.6}
  .pane.swap-target::after{content:"松开交换窗口位置";position:absolute;inset:6px;z-index:65;display:flex;align-items:center;justify-content:center;background:rgba(10,10,12,.8);border:2px dashed var(--accent);border-radius:6px;color:var(--ink);font:13px/1.4 var(--ui);pointer-events:none}

  /* 拖拽分割线 */
  .resizer{position:absolute;z-index:10;background:transparent}
  .resizer::after{content:"";position:absolute;background:var(--line);transition:background .12s}
  .resizer.h{width:7px;margin-left:-3px;cursor:col-resize}
  .resizer.h::after{top:0;bottom:0;left:3px;width:1px}
  .resizer.v{height:7px;margin-top:-3px;cursor:row-resize}
  .resizer.v::after{left:0;right:0;top:3px;height:1px}
  .resizer:hover::after,.resizer.dragging::after{background:var(--accent)}
  body.dragging-split iframe{pointer-events:none}
  body.dragging-split.dir-h{cursor:col-resize}
  body.dragging-split.dir-v{cursor:row-resize}

  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(16px);background:#121216;border:1px solid var(--line-strong);color:var(--ink);padding:7px 14px;border-radius:5px;opacity:0;transition:.2s;pointer-events:none;max-width:76vw;overflow:hidden;text-overflow:ellipsis;white-space:normal;z-index:200;box-shadow:0 10px 28px rgba(0,0,0,.55);font-size:12px}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .pane.drag-over::after,.pane-hist.drag-over::after{content:"松开上传文件并插入路径";position:absolute;inset:8px;z-index:60;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(238,152,51,.72);border-radius:8px;background:rgba(10,10,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);font:500 13px/1 var(--ui);letter-spacing:.03em;pointer-events:none}

  /* 窗格内单轮对话视图（与 Still Floating 入口配套：黑曜石透明底 + 暖纸白文字 + 日蚀琥珀点缀 + 划词引用评论） */
  #hist-btn.active{color:var(--ink);border-color:rgba(238,152,51,.48);background:rgba(238,152,51,.14)}
  html.wt-public-fold #hist-btn,
  html.wt-public-fold .hist-btn[data-act="close"]{display:none!important}
  .pane-hist{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;background:transparent;color:var(--ink);font-family:var(--ui);contain:layout style paint}
  .pane-hist.open{display:flex;overflow:hidden}
  .hist-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line-soft);background:rgba(10,10,12,.30)}
  .hist-title{font:500 11px/1 var(--mono);color:var(--gold);letter-spacing:.08em;white-space:nowrap}
  .hist-search{flex:1 1 110px;min-width:80px;max-width:200px;height:24px;padding:0 8px;border-radius:4px;border:1px solid var(--line-soft);background:rgba(10,10,12,.36);color:var(--ink);font:12px/1 var(--ui);outline:none;user-select:text;-webkit-user-select:text}
  .hist-search::placeholder{color:var(--muted)}
  .hist-search:focus{border-color:rgba(238,152,51,.55)}
  .hist-acts{display:flex;align-items:center;gap:6px;margin-left:auto}
  .hist-btn{height:24px;padding:0 8px;border-radius:4px;border:1px solid var(--line);background:rgba(241,236,227,.025);color:var(--muted);font:500 11.5px/1 var(--ui);cursor:pointer;white-space:nowrap;transition:background .14s,color .14s,border-color .14s}
  .hist-btn:hover,.hist-btn[aria-pressed=true]{color:var(--ink);background:rgba(238,152,51,.12);border-color:rgba(238,152,51,.48)}
  .hist-list{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:10px 12px 18px;display:flex;flex-direction:column;gap:8px;contain:content}
  .hist-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12.5px}

  .hist-older-host{position:relative;z-index:30;flex:0 0 auto;display:none;padding:4px 12px 2px;border-bottom:1px solid var(--line-soft);background:rgba(10,10,12,.22)}
  .hist-older-host.on{display:block}
  .hist-older{flex:0 0 auto;display:flex;flex-direction:column;padding-bottom:2px}
  .hist-older-toggle{width:100%;display:flex;align-items:center;gap:6px;padding:4px 2px;border:0;background:transparent;color:var(--muted);font:11.5px/1.3 var(--mono);letter-spacing:.04em;cursor:pointer;text-align:left;transition:color .14s}
  .hist-older-toggle:hover{color:var(--accent)}
  .hist-older-list{position:absolute;top:100%;left:6px;right:6px;z-index:30;display:flex;flex-direction:column;max-height:min(260px,36vh);overflow-y:auto;overscroll-behavior-y:contain;margin-top:2px;padding:4px;border:1px solid var(--line-strong);border-radius:5px;background:#121216;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .hist-older-row{flex-shrink:0}
  .pane-hist.compact .hist-banner{display:none}
  .pane-hist.compact .hist-search{height:28px}
  .hist-older-row{position:relative;width:100%;display:flex;align-items:center;gap:8px;padding:5px 6px;border:0;border-top:1px solid var(--line-soft);background:transparent;color:var(--ink-dim);font:12px/1.35 var(--ui);cursor:pointer;text-align:left;border-radius:3px;transition:padding-left .18s cubic-bezier(.22,1,.36,1),color .14s,background .14s}
  .hist-older-row:hover{background:rgba(238,152,51,.07);color:var(--ink);padding-left:10px}
  .hist-older-row.active{background:rgba(238,152,51,.12);color:var(--ink)}
  .hist-older-num{flex:0 0 auto;font:11px/1 var(--mono);color:var(--accent);min-width:26px}
  .hist-older-txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .hist-turn{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .hist-banner{display:none;flex:0 0 auto;margin:8px 14px 0;padding:8px 12px;border-radius:6px;border:1px solid var(--line-soft);background:rgba(10,10,12,.42);font:11.5px/1.12 var(--mono);color:var(--ink-dim);user-select:text;-webkit-user-select:text}
  .hist-banner.on{display:block}
  .hist-banner-pre{margin:0;white-space:pre;overflow-x:auto;scrollbar-width:none;font:inherit;line-height:inherit;color:inherit}
  .hist-banner-pre::-webkit-scrollbar{display:none}
  .hist-agent-card{display:flex;align-items:center;gap:11px;min-width:0}
  .hist-agent-ico{flex:0 0 auto;width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(241,236,227,.045);color:var(--accent2)}
  .hist-agent-ico svg{width:17px;height:17px;display:block}
  .pane-hist[data-agent="codex"] .hist-agent-ico,.pane-hist[data-cmd="codex"] .hist-agent-ico{color:#7cd4bc;border-color:rgba(124,212,188,.26);background:rgba(124,212,188,.08)}
  .pane-hist[data-agent="agy"] .hist-agent-ico,.pane-hist[data-cmd="agy"] .hist-agent-ico{color:var(--accent);border-color:rgba(238,152,51,.28);background:rgba(238,152,51,.09)}
  .pane-hist[data-agent="claude"] .hist-agent-ico,.pane-hist[data-cmd="claude"] .hist-agent-ico{color:var(--ember);border-color:rgba(210,106,76,.28);background:rgba(210,106,76,.09)}
  .hist-agent-body{min-width:0;display:flex;flex-direction:column;gap:3px}
  .hist-agent-top{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-width:0}
  .hist-agent-name{font:600 12.5px/1.2 var(--ui);color:var(--ink);letter-spacing:.01em}
  .hist-agent-model{padding:2px 6px;border-radius:4px;border:1px solid rgba(131,184,202,.24);background:rgba(131,184,202,.08);color:var(--accent2);font:11px/1.15 var(--mono)}
  .hist-agent-cwd{font:11px/1.25 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-turn-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font:11px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
  .hist-back-latest{border:0;background:transparent;color:var(--accent);font:11.5px/1 var(--ui);cursor:pointer;padding:2px 4px}
  .hist-back-latest:hover{text-decoration:underline}
  .hist-prompt{background:rgba(241,236,227,.042);border-left:2px solid var(--accent);padding:7px 11px;border-radius:4px;white-space:pre-wrap;word-break:break-word;font:13px/1.52 var(--mono);color:var(--ink);user-select:text;-webkit-user-select:text}
  .hist-prompt .ansi-pill{background:transparent!important;padding:0;border-radius:0}
  .hist-list,.hist-older-list,.hist-quotes,.hist-input,.hist-ac-list,#quota-pop{scrollbar-width:thin;scrollbar-color:rgba(241,236,227,.16) transparent}
  .hist-list::-webkit-scrollbar,.hist-older-list::-webkit-scrollbar,.hist-quotes::-webkit-scrollbar,.hist-input::-webkit-scrollbar,.hist-ac-list::-webkit-scrollbar,#quota-pop::-webkit-scrollbar{width:5px;height:5px}

<body>
<div id="bg-wall-blur"></div>
<div id="bg-wall"></div>
<div id="bg-vignette"></div>
<button id="wall-exit" type="button" aria-label="返回终端" title="返回终端 (Esc)">
  <svg viewBox="0 0 16 16"><path d="M9.5 3.5L5 8l4.5 4.5"/><path d="M5.5 8H13"/></svg>
  <span>回终端</span>
  <span class="hint">Esc</span>
</button>
<div id="app">
  <div id="bar">
    <span class="sf-mark" aria-hidden="true" title="Still Floating"></span>
    <div id="tabs-wrap">
      <div id="tablist"></div>
      <button id="add" class="icon-btn" title="新标签 (Ctrl+T)">

      </button>

    <button id="quota-pill" type="button" title="点击查看 X230 温度与资源占用详情">

      <span id="quota-mobile-lbl">状态</span>
    </button>

    <div class="sep"></div>

    <div id="acts">
      <button id="split-h" class="icon-btn" title="左右分屏 (Option+D)">
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.8"/><path d="M8 2.5v11"/></svg>
      </button>
      <button id="split-v" class="icon-btn" title="上下分屏 (Option+Shift+D)">
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.8"/><path d="M2 8h12"/></svg>
      </button>
      <button id="close-pane" class="icon-btn" title="关闭当前窗格 (Option+W)">
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.8"/><path d="M5.8 6.2l4.4 4.4M10.2 6.2l-4.4 4.4"/></svg>
      </button>

        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.8"/><circle cx="5.6" cy="6.1" r="1.1"/><path d="M2.6 12l3.3-3.1 2.4 2.2 2.2-2 3 2.9"/></svg>
      </button>
      <button id="upload-btn" class="icon-btn" type="button" title="上传文件到服务器并插入路径（支持多选/拖放）">
        <svg viewBox="0 0 16 16"><path d="M8 10.5V3.2M5.2 5.8L8 3l2.8 2.8"/><path d="M2.8 10.2v2.1a1.2 1.2 0 0 0 1.2 1.2h8a1.2 1.2 0 0 0 1.2-1.2v-2.1"/></svg>
        <span class="lbl">上传</span>
      </button>
      <input id="file-picker" type="file" multiple hidden>
      <button id="hist-btn" class="icon-btn" type="button" aria-pressed="false" title="折叠对话主视图（旧对话自动折起 + 底部直接输入，按 Option+H 切换原终端）">
        <svg viewBox="0 0 16 16"><path d="M3 4.2h10M3 8h6.5M3 11.8h8"/><path d="M11.2 7.5l1.8 1.8 1.8-1.8"/></svg>
        <span class="lbl">折叠对话</span>
      </button>
      <button id="wall-btn" class="icon-btn" type="button" aria-pressed="false" title="全屏纯享显示壁纸（再次点击、点画面或按 Esc 返回终端）">
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.8"/><path d="M5 10.5l2.3-2.5 2 2 1.8-1.7 2.4 2.2"/><circle cx="5.7" cy="5.8" r="1"/></svg>
        <span class="lbl">看壁纸</span>
      </button>
    </div>
  </div>

  <div id="stage"></div>
</div>

<div id="quota-pop" role="dialog" aria-label="X230 温度与资源占用">
  <div class="qhead">
    <div>
      <div class="qtitle">X230 运行状态</div>
      <div class="qmeta" id="quota-updated">未加载</div>
    </div>
    <button id="quota-refresh" class="icon-btn" title="立即刷新机器状态">
      <svg viewBox="0 0 16 16"><path d="M13.2 8a5.2 5.2 0 1 1-1.4-3.5M13.2 2.8v2.6h-2.6"/></svg>
      <span class="lbl">刷新</span>
    </button>
  </div>
  <div class="qgrid" id="quota-cards"></div>
</div>

<div id="toast"></div>

<script>
const HOST = String(location.hostname || '').toLowerCase();
const IS_LOCAL_HOST = !HOST || HOST === 'localhost' || HOST === '127.0.0.1' || HOST === '::1'
  || /^192\.168\./.test(HOST) || /^10\./.test(HOST)
  || /^172\.(?:1[6-9]|2\d|3[01])\./.test(HOST)
  || /^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(HOST)
  || HOST.endsWith('.local');
const FOLD_ONLY_PUBLIC = !IS_LOCAL_HOST || new URLSearchParams(location.search).get('public') === '1';
if (FOLD_ONLY_PUBLIC) document.documentElement.classList.add('wt-public-fold');

const STATE_KEY = 'wt_state_v1';
const stageEl = document.getElementById('stage');
const listEl = document.getElementById('tablist');
const toastEl = document.getElementById('toast');
const closePaneBtn = document.getElementById('close-pane');
const histBtn = document.getElementById('hist-btn');

let seq = 0, paneSeq = 0, useTick = 0, tabs = [], active = null, autoFocusUntil = 0, restoring = false;
const MAX_WARM_TABS = 4;
const paneEls = new Map();
let layoutMap = new Map();

function toast(m){
  toastEl.textContent = m;
  toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('on'), 2600);
}

function listLeaves(node, out = []){
  if (!node) return out;
  if (node.type === 'leaf') out.push(node);
  else { listLeaves(node.a, out); listLeaves(node.b, out); }
  return out;
}

function findLeaf(node, paneId){
  if (!node) return null;
  if (node.type === 'leaf') return node.id === paneId ? node : null;
  return findLeaf(node.a, paneId) || findLeaf(node.b, paneId);
}

function replaceLeaf(node, targetId, replacement){
  if (node.type === 'leaf') return node.id === targetId ? replacement : node;
  return {
    ...node,
    a: replaceLeaf(node.a, targetId, replacement),
    b: replaceLeaf(node.b, targetId, replacement)
  };
}

function removeLeaf(node, targetId){
  if (node.type === 'leaf') return node.id === targetId ? null : node;
  if (node.a.type === 'leaf' && node.a.id === targetId) return node.b;
  if (node.b.type === 'leaf' && node.b.id === targetId) return node.a;
  const na = removeLeaf(node.a, targetId);
  const nb = removeLeaf(node.b, targetId);
  return { ...node, a: na, b: nb };
}

function saveState(){
  if (restoring) return;
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      version: 2,
      seq,
      paneSeq,
      activeId: active ? active.id : null,
      tabs: tabs.map(t => ({
        id: t.id,
        name: t.name,
        activePaneId: t.activePaneId,
        root: t.root
      }))
    }));
  } catch (e) {}
}

function getPaneEl(leaf){
  let d = paneEls.get(leaf.id);
  if (d) return d;
  d = document.createElement('div');
  d.className = 'pane';
  d.dataset.paneId = leaf.id;
  d.dataset.sess = leaf.sess;
  d.addEventListener('mousedown', () => setPaneFocus(leaf.id, false), true);
  const grip=document.createElement('button');
  grip.type='button';grip.className='pane-move';grip.textContent='⠿ 换位';
  grip.title='拖到另一个窗口上，松开交换位置（Esc 取消）';
  grip.setAttribute('aria-label','拖动此窗口与另一个窗口交换位置');
  grip.addEventListener('pointerdown',e=>startPaneMove(e,d,grip));
  d.appendChild(grip);
  stageEl.appendChild(d);
  paneEls.set(leaf.id, d);
  return d;
}

function ensureFrame(paneEl){
  if (paneEl.querySelector('iframe')) return;
  autoFocusUntil = Date.now() + 1200;
  const f = document.createElement('iframe');
  f.dataset.connectSince = String(Date.now());
  f.src = '/tty/?arg=' + encodeURIComponent(paneEl.dataset.sess);
  f.allow = 'clipboard-read; clipboard-write';
  f.addEventListener('load', () => hookFrame(f, paneEl));
  paneEl.appendChild(f);
}

function updateTerminalConnection(paneEl){
  const frame = paneEl.querySelector('iframe');
  if (!frame || !paneEl.classList.contains('on')) return;
  let ready = false;
  try { ready = frame.contentWindow.__wtSocket?.readyState === 1 && !!frame.contentWindow.term; } catch(e) {}
  let box = paneEl.querySelector('.term-connection');
  if (ready) { frame.dataset.connectSince = String(Date.now()); if (box) box.hidden = true; return; }
  if (Date.now() - Number(frame.dataset.connectSince) < 10000) return;
  if (!box) {
    box = document.createElement('div'); box.className = 'term-connection'; box.setAttribute('role','status');
    box.innerHTML = '<p>终端尚未连接。可以重新连接，或尝试折叠对话。</p><button type="button" data-connect="retry">重新连接</button> <button type="button" data-connect="fold">折叠对话</button>';
    box.addEventListener('click', e => {
      const action = e.target.closest('[data-connect]')?.dataset.connect;
      if (action === 'retry') { frame.dataset.connectSince = String(Date.now()); box.hidden = true; frame.src = '/tty/?arg=' + encodeURIComponent(paneEl.dataset.sess) + '&retry=' + Date.now(); }
      if (action === 'fold') { openHistoryOverlay(paneEl); const hs = paneHistState.get(paneEl); if (hs) hs.liveEl.open = true; }
    });
    paneEl.appendChild(box);
  }
  box.hidden = false;
}
setInterval(() => { if (!document.hidden) for (const pane of paneEls.values()) updateTerminalConnection(pane); }, 1000);

function dropFrame(paneEl){
  const f = paneEl && paneEl.querySelector('iframe');
  if (f) {
    try { f.src = 'about:blank'; } catch (e) {}
    f.remove();
  }
}

function getFocusedPaneEl(){
  if (!active) return null;
  return paneEls.get(active.activePaneId) || null;
}

function syncFocusClasses(){
  const fid = active ? active.activePaneId : null;
  for (const [id, el] of paneEls.entries()) {
    el.classList.toggle('focused', id === fid && el.classList.contains('on'));
  }
  syncHistBtnState();
}

function focusPaneById(paneId, tries = 0){
  if (!active || active.activePaneId !== paneId) return;
  const el = paneEls.get(paneId);
  if (!el || !el.classList.contains('on')) return;
  if (el.classList.contains('hist-active')) {
    const hi = el.querySelector('.pane-hist.open .hist-input');
    if (hi) { hi.focus({ preventScroll: true }); return; }
  }
  const f = el.querySelector('iframe');
  try {
    const doc = f && f.contentDocument;
    const ta = doc && doc.querySelector('.xterm-helper-textarea');
    if (ta) {
      if (f.contentWindow) f.contentWindow.focus();
      ta.focus();
      return;
    }
  } catch (e) {}
  if (tries < 40) setTimeout(() => focusPaneById(paneId, tries + 1), 50);
}

function setPaneFocus(paneId, doFocus = true){
  if (!paneId) return;
  const owner = tabs.find(t => findLeaf(t.root, paneId));
  if (owner && owner === active) {
    owner.activePaneId = paneId;
  }
  syncFocusClasses();
  saveState();
  if (doFocus) focusPaneById(paneId);
}

function focusActive(){
  if (active && active.activePaneId) focusPaneById(active.activePaneId);
}

function inject(paneEl, text, tries = 0){
  const histInput = paneEl.querySelector('.pane-hist.open .hist-input');
  if (histInput) {
    const start = Number.isInteger(histInput.selectionStart) ? histInput.selectionStart : histInput.value.length;
    const end = Number.isInteger(histInput.selectionEnd) ? histInput.selectionEnd : histInput.value.length;
    histInput.value = histInput.value.slice(0, start) + text + histInput.value.slice(end);
    histInput.selectionStart = histInput.selectionEnd = start + text.length;
    histInput.dispatchEvent(new Event('input', { bubbles: true }));
    histInput.focus({ preventScroll: true });
    return true;
  }
  const f = paneEl.querySelector('iframe');
  try {
    const doc = f && f.contentDocument;
    const ta = doc && doc.querySelector('.xterm-helper-textarea');
    if (!ta) { if (tries < 15) { setTimeout(() => inject(paneEl, text, tries + 1), 200); return true; } return false; }
    ta.focus();
    const dt = new DataTransfer(); dt.setData('text/plain', text);
    ta.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
    return true;
  } catch (e) { return false; }
}

function hookFrame(f, paneEl){
  let doc; try { doc = f.contentDocument; } catch (e) { return; }
  if (!doc || doc.__wtHooked) return;
  doc.__wtHooked = true;
  const paneId = paneEl.dataset.paneId;
  const win = f.contentWindow || doc;
  win.addEventListener('keydown', navKey, true);
  doc.addEventListener('mousedown', () => { autoFocusUntil = 0; setPaneFocus(paneId, false); }, true);
  doc.addEventListener('focusin', () => {
    if (Date.now() < autoFocusUntil && active && paneId !== active.activePaneId) {
      focusActive();
      return;
    }
    setPaneFocus(paneId, false);
  }, true);
  doc.addEventListener('paste', async e => {
    const dt = e.clipboardData;
    const files = dt && dt.files ? [...dt.files] : [];
    const items = dt && dt.items ? [...dt.items] : [];
    const imgItem = items.find(i => i.type && i.type.startsWith('image/'));
    if (files.length && !imgItem) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      await uploadFiles(files, paneEl);
      return;
    }
    if (!imgItem) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    const blob = imgItem.getAsFile(); if (!blob) return;
    await upload(blob, paneEl);
  }, true);
  doc.addEventListener('dragover', e => {
    if (e.dataTransfer && [...e.dataTransfer.items].some(i => i.kind === 'file')) {
      e.preventDefault();
      paneEl.classList.add('drag-over');
    }
  }, true);
  doc.addEventListener('dragleave', e => {
    if (!e.relatedTarget || !doc.documentElement.contains(e.relatedTarget)) paneEl.classList.remove('drag-over');
  }, true);
  doc.addEventListener('drop', async e => {
    paneEl.classList.remove('drag-over');
    const files = e.dataTransfer ? [...e.dataTransfer.files] : [];
    if (!files.length) return;
    e.preventDefault(); e.stopPropagation();
    await uploadFiles(files, paneEl);
  }, true);
  if (paneEl.classList.contains('on') && active && paneId === active.activePaneId && !paneEl.classList.contains('hist-active')) focusPaneById(paneId);
}

async function upload(blob, paneEl){
  toast('上传图片…');
  try {
    const r = await fetch('/paste?s=' + encodeURIComponent(paneEl.dataset.sess), { method: 'POST', body: blob, headers: { 'Content-Type': blob.type || 'image/png' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    toast(inject(paneEl, j.path + ' ') ? '已插入路径：' + j.path : '已上传：' + j.path);
  } catch (err) { toast('上传失败：' + err.message); }
}

function formatByteSize(n){
  const v = Number(n) || 0;
  if (v < 1024) return v + ' B';
  if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
  return (v / (1024 * 1024)).toFixed(1) + ' MB';
}

function uploadSingleFile(file, paneEl, idx, total){
  return new Promise((resolve, reject) => {
    const sess = (paneEl && paneEl.dataset && paneEl.dataset.sess) || '';
    const name = (file && file.name) || ('upload-' + Date.now());
    const prefix = total > 1 ? ('[' + idx + '/' + total + '] ') : '';
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload?s=' + encodeURIComponent(sess) + '&name=' + encodeURIComponent(name));
    xhr.setRequestHeader('Content-Type', (file && file.type) || 'application/octet-stream');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && e.total > 0) {
        const pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
        toast(prefix + '上传 ' + name + ' ' + pct + '%');
      } else {
        toast(prefix + '上传 ' + name + '…');
      }
    };
    xhr.onload = () => {
      let j = null;
      try { j = JSON.parse(xhr.responseText || 'null'); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300 && j && j.path) resolve(j);
      else reject(new Error((j && j.error) || ('HTTP ' + xhr.status)));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.onabort = () => reject(new Error('已取消'));
    xhr.send(file);
  });
}

let pickerTargetPane = null;
function openFilePickerForPane(paneEl){
  const target = paneEl || getFocusedPaneEl() || [...paneEls.values()].find(p => p.classList.contains('on'));
  if (!target) { toast('当前没有活动窗格'); return; }
  pickerTargetPane = target;
  const picker = document.getElementById('file-picker');
  if (picker) { picker.value = ''; picker.click(); }
}

async function uploadFiles(fileList, paneEl){
  const files = [...(fileList || [])].filter(Boolean);
  if (!files.length) return;
  const target = paneEl || getFocusedPaneEl() || [...paneEls.values()].find(p => p.classList.contains('on'));
  if (!target) return;
  const uploaded = [];
  for (let i = 0; i < files.length; i++) {
    try {
      const res = await uploadSingleFile(files[i], target, i + 1, files.length);
      uploaded.push(res);
    } catch (err) {
      toast('上传失败（' + files[i].name + '）：' + err.message);
    }
  }
  if (!uploaded.length) return;
  const joined = uploaded.map(u => u.path).join(' ') + ' ';
  const inserted = inject(target, joined);
  if (uploaded.length === 1) {
    const u = uploaded[0];
    toast((inserted ? '已插入路径：' : '已上传：') + u.path + ' (' + formatByteSize(u.bytes) + ')');
  } else {
    toast((inserted ? '已插入 ' : '已上传 ') + uploaded.length + ' 个文件路径');
  }
}

async function pasteFromClipboard(){
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const t = it.types.find(x => x.startsWith('image/'));
      if (t) {
        const blob = await it.getType(t);
        const target = getFocusedPaneEl() || [...paneEls.values()].find(p => p.classList.contains('on'));
        if (target) return upload(blob, target);
      }
    }
    toast('剪贴板里没有图片');
  } catch (e) { toast('读不到剪贴板：' + e.message); }
}

function computeLayout(node, box, outPanes, outHandles){
  if (node.type === 'leaf') {
    outPanes.push({ leaf: node, box });
    return;
  }
  const r = Math.min(0.85, Math.max(0.15, Number(node.ratio) || 0.5));
  if (node.dir === 'h') {
    const w1 = box.w * r;
    const w2 = box.w - w1;
    computeLayout(node.a, { x: box.x, y: box.y, w: w1, h: box.h }, outPanes, outHandles);
    computeLayout(node.b, { x: box.x + w1, y: box.y, w: w2, h: box.h }, outPanes, outHandles);
    outHandles.push({ split: node, dir: 'h', x: box.x + w1, y: box.y, len: box.h, pBox: box });
  } else {
    const h1 = box.h * r;
    const h2 = box.h - h1;
    computeLayout(node.a, { x: box.x, y: box.y, w: box.w, h: h1 }, outPanes, outHandles);
    computeLayout(node.b, { x: box.x, y: box.y + h1, w: box.w, h: h2 }, outPanes, outHandles);
    outHandles.push({ split: node, dir: 'v', x: box.x, y: box.y + h1, len: box.w, pBox: box });
  }
}

function applyLayout(){
  for (const el of stageEl.querySelectorAll('.resizer')) el.remove();
  layoutMap = new Map();
  if (!active) return;

  const rects = [], handles = [];
  computeLayout(active.root, { x: 0, y: 0, w: 100, h: 100 }, rects, handles);
  stageEl.classList.toggle('multi', rects.length > 1);
  closePaneBtn.disabled = rects.length <= 1;

  for (const { leaf, box } of rects) {
    layoutMap.set(leaf.id, box);
    const el = getPaneEl(leaf);
    el.style.left = box.x.toFixed(4) + '%';
    el.style.top = box.y.toFixed(4) + '%';
    el.style.width = box.w.toFixed(4) + '%';
    el.style.height = box.h.toFixed(4) + '%';
  }

  for (const h of handles) {
    const div = document.createElement('div');
    div.className = 'resizer ' + h.dir;
    if (h.dir === 'h') {
      div.style.left = h.x.toFixed(4) + '%';
      div.style.top = h.y.toFixed(4) + '%';
      div.style.height = h.len.toFixed(4) + '%';
    } else {
      div.style.left = h.x.toFixed(4) + '%';
      div.style.top = h.y.toFixed(4) + '%';
      div.style.width = h.len.toFixed(4) + '%';
    }
    div.addEventListener('mousedown', e => startDrag(e, h, div));
    stageEl.appendChild(div);
  }
}

// Swap leaves in one traversal: replacing them sequentially would duplicate a pane id.
function swapPanePositions(sourceId,targetId){
  if(!active || sourceId===targetId)return false;
  const a=findLeaf(active.root,sourceId),b=findLeaf(active.root,targetId);
  if(!a || !b)return false;
  function swap(node){
    if(node.type==='leaf')return node.id===sourceId?b:node.id===targetId?a:node;
    return {...node,a:swap(node.a),b:swap(node.b)};
  }
  active.root=swap(active.root);
  // Keep existing DOM, iframe, history state and draft attached to their sessions.
  applyLayout();setPaneFocus(sourceId,false);saveState();
  return true;
}

function startPaneMove(e,pane,grip){
  if(e.button!==0 || !active || listLeaves(active.root).length<2)return;
  e.preventDefault();
  const owner=active,sourceId=pane.dataset.paneId,startX=e.clientX,startY=e.clientY;
  let moving=false,target=null;
  grip.setPointerCapture(e.pointerId);
  const clearTarget=()=>{if(target)target.classList.remove('swap-target');target=null;};
  const onMove=ev=>{
    if(ev.pointerId!==e.pointerId)return;
    if(!moving && Math.hypot(ev.clientX-startX,ev.clientY-startY)<6)return;
    moving=true;document.body.classList.add('moving-pane');pane.classList.add('swap-source');
    clearTarget();
    if(active!==owner)return;
    for(const leaf of listLeaves(owner.root)){
      if(leaf.id===sourceId)continue;
      const el=paneEls.get(leaf.id),r=el?.getBoundingClientRect();
      if(r && ev.clientX>=r.left && ev.clientX<r.right && ev.clientY>=r.top && ev.clientY<r.bottom){target=el;target.classList.add('swap-target');break;}
    }
  };
  const finish=(ev,cancel=false)=>{
    if(ev && ev.pointerId!==undefined && ev.pointerId!==e.pointerId)return;
    const targetId=target?.dataset.paneId;
    clearTarget();pane.classList.remove('swap-source');document.body.classList.remove('moving-pane');
    grip.removeEventListener('pointermove',onMove);
    grip.removeEventListener('pointerup',onUp);
    grip.removeEventListener('pointercancel',onCancel);
    grip.removeEventListener('lostpointercapture',onCancel);
    window.removeEventListener('keydown',onKey,true);
    window.removeEventListener('blur',onCancel);
    if(grip.hasPointerCapture(e.pointerId))grip.releasePointerCapture(e.pointerId);
    if(!cancel && moving && active===owner && targetId && swapPanePositions(sourceId,targetId))toast('已交换窗口位置');
  };
  const onUp=ev=>{onMove(ev);finish(ev);};
  const onCancel=ev=>finish(ev,true);
  const onKey=ev=>{if(ev.key==='Escape'){ev.preventDefault();ev.stopImmediatePropagation();finish(null,true);}};
  grip.addEventListener('pointermove',onMove);
  grip.addEventListener('pointerup',onUp);
  grip.addEventListener('pointercancel',onCancel);
  grip.addEventListener('lostpointercapture',onCancel);
  window.addEventListener('keydown',onKey,true);
  window.addEventListener('blur',onCancel);
}

function startDrag(e, h, handleEl){
  e.preventDefault();
  const rect = stageEl.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  document.body.classList.add('dragging-split', 'dir-' + h.dir);
  handleEl.classList.add('dragging');

  const onMove = ev => {
    if (h.dir === 'h') {
      const pctX = ((ev.clientX - rect.left) / rect.width) * 100;
      h.split.ratio = Math.min(0.85, Math.max(0.15, (pctX - h.pBox.x) / h.pBox.w));
    } else {
      const pctY = ((ev.clientY - rect.top) / rect.height) * 100;
      h.split.ratio = Math.min(0.85, Math.max(0.15, (pctY - h.pBox.y) / h.pBox.h));
    }
    applyLayout();
  };
  const onUp = () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    document.body.classList.remove('dragging-split', 'dir-h', 'dir-v');
    saveState();
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

function render(){
  listEl.innerHTML = '';
  tabs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t === active ? ' active' : '');
    const dot = document.createElement('span'); dot.className = 'dot';
    const nameEl = document.createElement('span'); nameEl.className = 'tname'; nameEl.textContent = t.name;
    const xEl = document.createElement('span'); xEl.className = 'x'; xEl.textContent = '×';
    el.append(dot, nameEl, xEl);
    el.onclick = e => {
      if (e.target === xEl) closeTab(t);
      else { active = t; render(); focusActive(); }
    };
    el.ondblclick = e => {
      if (e.target === xEl) return;
      const next = prompt('重命名标签页', t.name);
      if (next && next.trim()) { t.name = next.trim().slice(0, 24); render(); }
    };
    listEl.appendChild(el);
  });

  if (active) active.lastUsedAt = ++useTick;
  const warmTabs = new Set(
    [...tabs].sort((a, b) => (b.lastUsedAt || 0) - (a.lastUsedAt || 0)).slice(0, MAX_WARM_TABS)
  );
  if (active) warmTabs.add(active);

  const activeLeaves = active ? listLeaves(active.root) : [];
  const activeIds = new Set(activeLeaves.map(l => l.id));
  if (active && !activeIds.has(active.activePaneId) && activeLeaves.length) {
    active.activePaneId = activeLeaves[0].id;
  }

  for (const t of tabs) {
    const keepWarm = warmTabs.has(t);
    for (const leaf of listLeaves(t.root)) {
      const el = getPaneEl(leaf);
      const on = (t === active) && activeIds.has(leaf.id);
      el.classList.toggle('on', on);
      if (on) {
        ensureFrame(el);
        checkAutoFoldNow(el);
      } else if (!keepWarm) {
        dropFrame(el);
      }
    }
  }

  applyLayout();
  syncFocusClasses();
  syncHistStreams();
  saveState();
}

function mkLeaf(tabId, explicitSess){
  const pid = 'p' + (++paneSeq);
  const sess = explicitSess || ('s' + tabId + '-' + Array.from(crypto.getRandomValues(new Uint32Array(2)), n => n.toString(16).padStart(8, '0')).join(''));
  return { type: 'leaf', id: pid, sess };
}

function newTab(){
  const id = ++seq;
  const leaf = mkLeaf(id);
  const t = { id, name: 'fish ' + id, root: leaf, activePaneId: leaf.id };
  tabs.push(t);
  active = t;
  render();
  focusActive();
  return t;
}

window.addEventListener('beforeunload', e => {
  if (tabs.length && !window.__wtInternalReload) { e.preventDefault(); e.returnValue = ''; }
});

function closeTab(t){
  if (!confirm('确定关闭终端标签「' + t.name + '」？该标签中的终端会话及正在运行的任务将被结束。')) return;
  for (const leaf of listLeaves(t.root)) {
    const el = paneEls.get(leaf.id);
    if (el) {
      disposeHistOverlay(el);
      const hist = paneHistState.get(el); if (hist) hist.resizeObserver.disconnect();
      dropFrame(el);
      el.remove();
      paneEls.delete(leaf.id);
    }
    try { sessionStorage.removeItem(DRAFT_PREFIX + leaf.sess); } catch (e) {}
    fetch('/close?s=' + encodeURIComponent(leaf.sess)).catch(() => {});
  }
  tabs = tabs.filter(x => x !== t);
  if (active === t) active = tabs[tabs.length - 1] || null;
  if (!tabs.length) newTab();
  else { render(); focusActive(); }
}

function splitPane(dir){
  if (!active || !active.activePaneId) return;
  const curLeaf = findLeaf(active.root, active.activePaneId);
  if (!curLeaf) return;
  const newLeaf = mkLeaf(active.id);
  active.root = replaceLeaf(active.root, curLeaf.id, {
    type: 'split',
    dir,
    ratio: 0.5,
    a: curLeaf,
    b: newLeaf
  });
  active.activePaneId = newLeaf.id;
  render();
  focusActive();
}

function closeActivePane(){
  if (!active || !active.activePaneId) return;
  const leaves = listLeaves(active.root);
  if (leaves.length <= 1) return;
  const victimId = active.activePaneId;
  const victimLeaf = findLeaf(active.root, victimId);
  if (!victimLeaf) return;

  if (!confirm('确定关闭当前分屏？这个终端会话及正在运行的任务将被结束。')) return;
  const idx = leaves.findIndex(l => l.id === victimId);
  const nextRoot = removeLeaf(active.root, victimId);
  const el = paneEls.get(victimId);
  if (el) {
    disposeHistOverlay(el);
    const hist = paneHistState.get(el); if (hist) hist.resizeObserver.disconnect();
    dropFrame(el);
    el.remove();
    paneEls.delete(victimId);
  }
  try { sessionStorage.removeItem(DRAFT_PREFIX + victimLeaf.sess); } catch (e) {}
  fetch('/close?s=' + encodeURIComponent(victimLeaf.sess)).catch(() => {});

  active.root = nextRoot;
  const remain = listLeaves(active.root);
  const pick = remain[Math.min(idx, remain.length - 1)] || remain[0];
  active.activePaneId = pick ? pick.id : null;
  render();
  focusActive();
}

function pickEdgePane(tab, edge){
  const rects = [];
  computeLayout(tab.root, { x: 0, y: 0, w: 100, h: 100 }, rects, []);
  if (!rects.length) return null;
  if (edge === 'left') {
    rects.sort((a, b) => (a.box.x - b.box.x) || (a.box.y - b.box.y));
  } else {
    rects.sort((a, b) => ((b.box.x + b.box.w) - (a.box.x + a.box.w)) || (a.box.y - b.box.y));
  }
  return rects[0].leaf.id;
}

function switchTab(dir, edge = null){
  if (tabs.length < 2) return false;
  const i = tabs.indexOf(active);
  active = tabs[(i + dir + tabs.length) % tabs.length];
  if (edge) {
    const pid = pickEdgePane(active, edge);
    if (pid) active.activePaneId = pid;
  }
  render();
  focusActive();
  return true;
}

function moveFocus(dirName){
  if (!active) return;
  autoFocusUntil = 0;
  const curBox = layoutMap.get(active.activePaneId);
  if (!curBox) return;

  const curCx = curBox.x + curBox.w / 2;
  const curCy = curBox.y + curBox.h / 2;
  let bestId = null, bestScore = Infinity;

  for (const [id, b] of layoutMap.entries()) {
    if (id === active.activePaneId) continue;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    let dist = Infinity, overlap = 0;

    if (dirName === 'left' && cx < curCx - 0.5) {
      overlap = Math.max(0, Math.min(curBox.y + curBox.h, b.y + b.h) - Math.max(curBox.y, b.y));
      dist = Math.max(0, curBox.x - (b.x + b.w)) * 10 + Math.abs(cy - curCy) - overlap * 2;
    } else if (dirName === 'right' && cx > curCx + 0.5) {
      overlap = Math.max(0, Math.min(curBox.y + curBox.h, b.y + b.h) - Math.max(curBox.y, b.y));
      dist = Math.max(0, b.x - (curBox.x + curBox.w)) * 10 + Math.abs(cy - curCy) - overlap * 2;
    } else if (dirName === 'up' && cy < curCy - 0.5) {
      overlap = Math.max(0, Math.min(curBox.x + curBox.w, b.x + b.w) - Math.max(curBox.x, b.x));
      dist = Math.max(0, curBox.y - (b.y + b.h)) * 10 + Math.abs(cx - curCx) - overlap * 2;
    } else if (dirName === 'down' && cy > curCy + 0.5) {
      overlap = Math.max(0, Math.min(curBox.x + curBox.w, b.x + b.w) - Math.max(curBox.x, b.x));
      dist = Math.max(0, b.y - (curBox.y + curBox.h)) * 10 + Math.abs(cx - curCx) - overlap * 2;
    }
    if (dist < bestScore) { bestScore = dist; bestId = id; }
  }

  if (bestId) {
    setPaneFocus(bestId, true);
    return;
  }
  if (dirName === 'left') switchTab(-1, 'right');
  else if (dirName === 'right') switchTab(1, 'left');
}

window.wtNotifyCopy = len => toast('已复制 ' + len + ' 字');

function copyTextTop(txt){
  txt = String(txt || '').replace(/[ \t]+(?=\r?\n|$)/g, '');
  if (!txt) return false;
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus({ preventScroll: true });
    ta.select();
    ta.setSelectionRange(0, txt.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) {}
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
  if (ok) toast('已复制 ' + txt.length + ' 字');
  return ok;
}

function copyActiveSelection(){
  if (!active || !active.activePaneId) return false;
  const pEl = active.paneMap && active.paneMap.get(active.activePaneId);
  const f = pEl && pEl.querySelector('iframe');
  try {
    const win = f && f.contentWindow;
    const t = win && win.term;
    if (t && t.hasSelection && t.hasSelection()) {
      const txt = t.getSelection();
      if (txt) return copyTextTop(txt);
    }
  } catch (e) {}
  return false;
}

function navKey(e){
  const isC = (e.code === 'KeyC' || (e.key && e.key.toLowerCase() === 'c'));
  if (((e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) || (e.ctrlKey && e.shiftKey && !e.metaKey && !e.altKey)) && isC) {
    if (copyActiveSelection()) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      return;
    }
  }
  const dirMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  const dir = dirMap[e.key];
  if (dir && (e.metaKey || e.altKey) && !e.ctrlKey && !e.shiftKey) {
    if (e.metaKey && e.altKey) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    moveFocus(dir);
    return;
  }
  if (e.altKey && !e.metaKey && !e.ctrlKey && e.code === 'KeyD') {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    splitPane(e.shiftKey ? 'v' : 'h');
    return;
  }
  if (e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.code === 'KeyW') {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    closeActivePane();
    return;
  }
  if (e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.code === 'KeyH') {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    toggleHistoryOverlay();
    return;
  }
  if (e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey && (e.code === 'KeyM' || e.key === 'µ' || e.key === 'm' || e.key === 'M')) {
    const pEl = getFocusedPaneEl();
    const box = pEl && pEl.querySelector('.pane-hist.open');
    if (box) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      const stM = paneHistState.get(pEl);
      if (stM) stM.blockAltMuUntil = Date.now() + 140;
      if (stM && document.activeElement === stM.inputEl && typeof stM.triggerAltM === 'function') stM.triggerAltM();
      else if (pEl.dataset.sess) { sendRawToPane(pEl, '\x1bm').then(ok => { if (ok) toast('已发送 Alt+M'); setTimeout(() => pokeHistStream(pEl.dataset.sess), 25); }); }
      return;
    }
  }
  if (e.key === 'Escape') {
    const pEl = getFocusedPaneEl();
    const box = pEl && pEl.querySelector('.pane-hist.open');
    if (box) {
      const inp = box.querySelector('.hist-search');
      if (inp && document.activeElement === inp && inp.value) {
        inp.value = '';
        inp.dispatchEvent(new Event('input'));
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      }
      return;
    }
  }
  if (e.ctrlKey && (e.key === 'PageUp' || e.key === 'PageDown')) {
    e.preventDefault(); e.stopPropagation();
    switchTab(e.key === 'PageUp' ? -1 : 1);
  }
}

function restoreState(){
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.tabs) || !s.tabs.length) return false;
    restoring = true;

    if (s.version === 2) {
      let maxId = Number(s.seq) || 0;
      let maxPane = Number(s.paneSeq) || 0;
      for (const st of s.tabs) {
        if (!st || !st.root) continue;
        const id = Number(st.id) || (++maxId);
        if (id > maxId) maxId = id;
        for (const l of listLeaves(st.root)) {
          const n = parseInt(String(l.id).replace(/^p/, ''), 10);
          if (n > maxPane) maxPane = n;
        }
        const leaves = listLeaves(st.root);
        if (!leaves.length) continue;
        const activePaneId = findLeaf(st.root, st.activePaneId) ? st.activePaneId : leaves[0].id;
        tabs.push({ id, name: String(st.name || ('fish ' + id)), root: st.root, activePaneId });
      }
      seq = maxId;
      paneSeq = maxPane;
    } else {
      // 迁移旧版 v1（split + panes[]）到二叉树
      let maxId = Number(s.seq) || 0;
      for (const st of s.tabs) {
        const id = Number(st.id) || (++maxId);
        if (id > maxId) maxId = id;
        const pList = Array.isArray(st.panes) && st.panes.length ? st.panes : ['s' + id + '-1'];
        const l1 = mkLeaf(id, String(pList[0]));
        let root = l1, activePaneId = l1.id;
        if (s.split) {
          const l2 = mkLeaf(id, pList[1] ? String(pList[1]) : undefined);
          root = { type: 'split', dir: 'h', ratio: 0.5, a: l1, b: l2 };
          if (Number(st.activePane) === 1) activePaneId = l2.id;
        }
        tabs.push({ id, name: String(st.name || ('fish ' + id)), root, activePaneId });
      }
      seq = maxId;
    }

    if (!tabs.length) { restoring = false; return false; }
    active = tabs.find(t => t.id === s.activeId) || tabs[0];
    restoring = false;
    render();
    focusActive();
    return true;
  } catch (e) {
    restoring = false;
    tabs = []; active = null;
    return false;
  }
}

function sysLevel(val, warn, crit){

function fmtUptime(sec){
  if (!sec || sec < 0) return '--';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return (d > 0 ? `${d}天` : '') + `${h}小时${m}分`;
}

function chipHtml(label, val, lvl){

function renderSys(data){

const TOKYO_BASE = ['#0a0a0c', '#e2708f', '#98b88c', '#ee9833', '#83b8ca', '#b8a1c9', '#cbb38f', '#d8d2c7'];
const TOKYO_BRIGHT = ['#5b6064', '#e2708f', '#98b88c', '#ee9833', '#83b8ca', '#b8a1c9', '#cbb38f', '#f1ece3'];

function xterm256ToRgb(n){
  n = n | 0;
  if (n < 0 || n > 255) return null;
  if (n < 8) return TOKYO_BASE[n];
  if (n < 16) return TOKYO_BRIGHT[n - 8];
  if (n < 232) {
    const idx = n - 16;
    const steps = [0, 95, 135, 175, 215, 255];
    const r = steps[Math.floor(idx / 36)];
    const g = steps[Math.floor((idx % 36) / 6)];
    const b = steps[idx % 6];
    return [r, g, b];
  }
  const v = 8 + (n - 232) * 10;
  return [v, v, v];
}

function formatAnsiBg(color){
  if (typeof color === 'string') return color;
  const [r, g, b] = color;
  // Soften dark gray terminal chips / prompt bars into translucent warm parchment glass pills.
  if (Math.max(r, g, b) <= 72 && Math.max(r, g, b) - Math.min(r, g, b) <= 16) {
    return 'rgba(241,236,227,0.08)';
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',0.32)';
}

function formatAnsiFg(color){
  if (typeof color === 'string') return color;
  return 'rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')';
}

function applySgrParams(paramsStr, state){
  const parts = paramsStr === '' ? [0] : paramsStr.split(/[;:]/).map(x => x === '' ? 0 : parseInt(x, 10));
  for (let i = 0; i < parts.length; i++) {
    const c = parts[i];
    if (Number.isNaN(c) || c === 0) {
      state.fg = null; state.bg = null; state.bold = false; state.dim = false; state.italic = false; state.under = false; state.strike = false; state.inv = false;
    } else if (c === 1) state.bold = true;
    else if (c === 2) state.dim = true;
    else if (c === 3) state.italic = true;
    else if (c === 4) state.under = true;
    else if (c === 7) state.inv = true;
    else if (c === 9) state.strike = true;
    else if (c === 21 || c === 22) { state.bold = false; state.dim = false; }
    else if (c === 23) state.italic = false;
    else if (c === 24) state.under = false;
    else if (c === 27) state.inv = false;
    else if (c === 29) state.strike = false;
    else if (c >= 30 && c <= 37) state.fg = TOKYO_BASE[c - 30];
    else if (c === 39) state.fg = null;
    else if (c >= 90 && c <= 97) state.fg = TOKYO_BRIGHT[c - 90];
    else if (c >= 40 && c <= 47) state.bg = TOKYO_BASE[c - 40];
    else if (c === 49) state.bg = null;
    else if (c >= 100 && c <= 107) state.bg = TOKYO_BRIGHT[c - 100];
    else if ((c === 38 || c === 48) && i + 1 < parts.length) {
      const mode = parts[i + 1];
      if (mode === 5 && i + 2 < parts.length) {
        const col = xterm256ToRgb(parts[i + 2]);
        if (c === 38) state.fg = col; else state.bg = col;
        i += 2;
      } else if (mode === 2 && i + 4 < parts.length) {
        const rgb = [parts[i + 2] & 255, parts[i + 3] & 255, parts[i + 4] & 255];
        if (c === 38) state.fg = rgb; else state.bg = rgb;
        i += 4;
      }
    }
  }
}

const SPINNER_GLYPH_RE = /[\u2801-\u28ff◐◓◑◒◴◵◶◷]/g;
const LEADING_SPIN_RE = /^([ \t]*)(?:([\u2801-\u28ff◐◓◑◒◴◵◶◷])([ \t]+)|([✳✶✻✽✢])([ \t]+(?=\S+(?:ing\b|…)))|(•)([ \t]+(?=Working\s*\()))/;

function matchLeadingSpin(line){
  const m = String(line || '').match(LEADING_SPIN_RE);
  if (!m) return null;
  return { indent: m[1] || '', glyph: m[2] || m[4] || m[6] || '', gap: m[3] || m[5] || m[7] || '', len: m[0].length };
}

function normalizeSpinners(s){
  return String(s || '')
    .replace(SPINNER_GLYPH_RE, '⠋')
    .replace(/[✳✶✻✽✢](?=[ \t]+\S+(?:ing\b|…))/g, '✳');
}

function makeSpinNode(){
  const sp = document.createElement('span');
  sp.className = 'wt-spin';
  sp.setAttribute('aria-hidden', 'true');
  return sp;
}

function ansiLinesToFragment(ansiLines, plainLines, opts){
  const exactBg = !!(opts && opts.exactBg);
  const frag = document.createDocumentFragment();
  const state = { fg: null, bg: null, bold: false, dim: false, italic: false, under: false, strike: false, inv: false };
  const escRe = /\x1b\[([0-9;:]*)([@-~])|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g;

  for (let li = 0; li < ansiLines.length; li++) {
    const rawLine = ansiLines[li] || '';
    const plainLine = plainLines ? (plainLines[li] || '') : rawLine;
    const hasEsc = rawLine.indexOf('\x1b') !== -1;
    let spinPending = !exactBg && !!matchLeadingSpin(plainLine);

    if (!hasEsc && !(state.fg || state.bg || state.bold || state.dim || state.italic || state.under || state.strike || state.inv)) {
      const suffix = li < ansiLines.length - 1 ? '\n' : '';
      let lineBody = rawLine;
      if (spinPending) {
        const sm = matchLeadingSpin(lineBody);
        if (sm) {
          if (sm.indent) frag.appendChild(document.createTextNode(sm.indent));
          frag.appendChild(makeSpinNode());
          lineBody = lineBody.slice(sm.len);
        }
      }
      const t = plainLine.trimStart();
      if (!exactBg && /^(?:○|▸)\s+Thought\b/.test(t)) {
        const sp = document.createElement('span');
        sp.className = 'hist-thought';
        sp.textContent = lineBody + suffix;
        frag.appendChild(sp);
      } else if (!exactBg && /^(?:[●•]\s+(?:Ran|Explored|Searched|Read|Edited|Wrote|Updated|Created|Deleted|Checked|Called)|Worked for\s+\d)/.test(t)) {
        const sp = document.createElement('span');
        sp.className = 'hist-step';
        sp.textContent = lineBody + suffix;
        frag.appendChild(sp);
      } else {
        frag.appendChild(document.createTextNode(lineBody + suffix));
      }
      continue;
    }

    escRe.lastIndex = 0;
    let last = 0;
    let m;
    let lineAtStart = true;
    const emitChunk = (txt) => {
      if (!txt) return;
      if (spinPending && lineAtStart) {
        const leadOnlySpaces = /^[ \t]+$/.test(txt);
        const sm = matchLeadingSpin(txt);
        if (sm) {
          if (sm.indent) frag.appendChild(document.createTextNode(sm.indent));
          frag.appendChild(makeSpinNode());
          txt = txt.slice(sm.len);
          spinPending = false;
          lineAtStart = false;
          if (!txt) return;
        } else if (!leadOnlySpaces) {
          const singleSpin = txt.match(/^([\u2801-\u28ff◐◓◑◒◴◵◶◷✳✶✻✽✢•])([ \t]*)$/);
          if (singleSpin) {
            frag.appendChild(makeSpinNode());
            spinPending = false;
            lineAtStart = false;
            return;
          }
          lineAtStart = false;
        }
      }
      if (txt.trim()) lineAtStart = false;
      const styled = state.fg || state.bg || state.bold || state.dim || state.italic || state.under || state.strike || state.inv;
      if (!styled) {
        frag.appendChild(document.createTextNode(txt));
        return;
      }
      const sp = document.createElement('span');
      const fgColor = state.inv ? (state.bg || '#15161e') : state.fg;
      const bgColor = state.inv ? (state.fg || '#f1ece3') : state.bg;
      if (fgColor) sp.style.color = formatAnsiFg(fgColor);
      if (bgColor) {
        if (exactBg) {
          sp.style.background = formatAnsiFg(bgColor);
        } else {
          sp.style.background = formatAnsiBg(bgColor);
          sp.className = 'ansi-pill';
        }
      }
      if (state.bold) sp.style.fontWeight = '600';
      if (state.dim) sp.classList.add('ansi-dim');
      if (state.italic) sp.style.fontStyle = 'italic';
      if (state.under || state.strike) {
        sp.style.textDecoration = [state.under ? 'underline' : '', state.strike ? 'line-through' : ''].filter(Boolean).join(' ');
      }
      sp.textContent = txt;
      frag.appendChild(sp);
    };

    while ((m = escRe.exec(rawLine)) !== null) {
      if (m.index > last) emitChunk(rawLine.slice(last, m.index));
      if (m[2] === 'm') applySgrParams(m[1], state);
      last = escRe.lastIndex;
    }
    if (last < rawLine.length) emitChunk(rawLine.slice(last));
    if (li < ansiLines.length - 1) frag.appendChild(document.createTextNode('\n'));
  }
  return frag;
}

function decomposeReplyBlocks(turn, st, key){
  let plainLines = String(turn.reply || '').split('\n');
  let ansiLines = String(turn.replyAnsi || turn.reply || '').split('\n');
  if (ansiLines.length !== plainLines.length) ansiLines = plainLines.slice();

  const totalLines = plainLines.length;
  const limit = HIST_FOLD_OVER_LINES;
  const isFolded = totalLines > limit && !st.openLongTurns.has(key);
  const isExpandedLong = totalLines > limit && st.openLongTurns.has(key);
  const truncatedCount = totalLines > limit ? (totalLines - 36) : 0;

  const blocks = [];
  let blockIdx = 0;

  const pushSegment = (segPlain, segAnsi) => {
    let i = 0;
    let plainBuf = [], ansiBuf = [];
    const flushPlain = () => {
      if (!plainBuf.length) return;
      const p = plainBuf.slice();
      const a = ansiBuf.slice();
      blocks.push({
        type: 'text',
        bKey: key + '#t' + blocks.length,
        sig: normalizeSpinners(a.join('\n')),
        plainLines: p,
        ansiLines: a
      });
      plainBuf = [];
      ansiBuf = [];
    };

    while (i < segPlain.length) {
      if (isProcessLine(segPlain[i])) {
        flushPlain();
        const blockPlain = [segPlain[i]];
        const blockAnsi = [segAnsi[i]];
        let sawTreeDetail = /^\s*[└├│]/.test(segPlain[i]);
        i++;
        while (i < segPlain.length) {
          const ln = segPlain[i];
          if (isProcessLine(ln)) {
            if (/^\s*[└├│]/.test(ln)) sawTreeDetail = true;
            blockPlain.push(ln);
            blockAnsi.push(segAnsi[i]);
            i++;
            continue;
          }
          if (!ln.trim()) {
            if (segPlain[i + 1] !== undefined && isProcessLine(segPlain[i + 1])) {
              blockPlain.push(ln);
              blockAnsi.push(segAnsi[i]);
              i++;
              continue;
            }
            break;
          }
          if (isSubDetailLine(ln) || (sawTreeDetail && /^\s{4,}\S/.test(ln))) {
            blockPlain.push(ln);
            blockAnsi.push(segAnsi[i]);
            i++;
            continue;
          }
          break;
        }
        while (blockPlain.length > 1 && !blockPlain[blockPlain.length - 1].trim()) {
          blockPlain.pop();
          blockAnsi.pop();
        }
        const bKey = key + '#s' + (blockIdx++);
        const stepOpen = st.openStepBlocks.has(bKey);
        blocks.push({
          type: 'step',
          bKey,
          stepOpen,
          sig: (stepOpen ? '1:' : '0:') + normalizeSpinners(blockAnsi.join('\n')),
          plainLines: blockPlain,
          ansiLines: blockAnsi
        });
      } else {
        plainBuf.push(segPlain[i]);
        ansiBuf.push(segAnsi[i]);
        i++;
      }
    }
    flushPlain();
  };

  if (isFolded) {
    pushSegment(plainLines.slice(0, 12), ansiLines.slice(0, 12));
    blocks.push({
      type: 'more',
      bKey: key + '#more',
      sig: 'more:' + truncatedCount,
      truncatedCount,
      expanded: false
    });
    // Restore the terminal style at the tail boundary, including resets inside the omitted range.
    const tailStyle = (ansiLines.slice(0, -24).join('\n').match(/\x1b\[[0-9;:]*m/g) || []).join('');
    const tailPlain = plainLines.slice(-24);
    const tailAnsi = ansiLines.slice(-24);
    tailAnsi[0] = '\x1b[0m' + tailStyle + tailAnsi[0];
    pushSegment(tailPlain, tailAnsi);
  } else {
    pushSegment(plainLines, ansiLines);
    if (isExpandedLong) {
      blocks.push({
        type: 'more',
        bKey: key + '#less',
        sig: 'less:' + truncatedCount,
        truncatedCount,
        expanded: true
      });
    }
  }
  return blocks;
}

function createOrUpdateBlockEl(block, oldEntry, st, key, paneEl){
  if (block.type === 'text') {
    const el = (oldEntry && oldEntry.type === 'text') ? oldEntry.el : document.createElement('div');
    if (!oldEntry || oldEntry.type !== 'text') el.className = 'hist-reply';
    if (!oldEntry || oldEntry.sig !== block.sig) {
      const raw = block.ansiLines.join('\n');
      const plainText = !raw.includes('\x1b') && block.plainLines.every(line => !matchLeadingSpin(line) && !/^(?:○|▸)\s+Thought\b/.test(line.trimStart()));
      if (plainText) {
        if (el.childNodes.length === 1 && el.firstChild.nodeType === 3) el.firstChild.data = raw;
        else el.replaceChildren(document.createTextNode(raw));
      } else {
        el.replaceChildren(ansiLinesToFragment(block.ansiLines, block.plainLines));
      }
    }
    return { type: 'text', bKey: block.bKey, sig: block.sig, el };
  }

  if (block.type === 'step') {
    let box, btn, pre;
    const reuse = oldEntry && oldEntry.type === 'step' && oldEntry.bKey === block.bKey;
    if (reuse) {
      box = oldEntry.el;
      btn = oldEntry.btn;
      pre = oldEntry.pre;
    } else {
      box = document.createElement('div');
      box.className = 'hist-step-box';
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hist-step-toggle';
      btn.addEventListener('click', () => {
        preserveHistScrollAround(paneEl, () => {
          if (st.openStepBlocks.has(block.bKey)) st.openStepBlocks.delete(block.bKey);
          else st.openStepBlocks.add(block.bKey);
        }, btn);
      });
      box.appendChild(btn);
      pre = null;
    }
    if (!reuse || oldEntry.sig !== block.sig) {
      const firstLine = block.plainLines[0].trim();
      const firstSum = firstLine.slice(0, 72);
      const countSuffix = block.plainLines.length > 1 ? ' · ' + block.plainLines.length + '行' : '';
      const sm = matchLeadingSpin(firstLine);
      btn.setAttribute('aria-expanded', String(block.stepOpen));
      btn.replaceChildren();
      btn.appendChild(document.createTextNode(block.stepOpen ? '▾ ' : '▸ '));
      if (sm) btn.appendChild(makeSpinNode());
      btn.appendChild(document.createTextNode((sm ? firstSum.slice(sm.len) : firstSum) + countSuffix));

      if (block.stepOpen) {
        if (!pre) {
          pre = document.createElement('pre');
          pre.className = 'hist-step-pre';
          box.appendChild(pre);
        }
        pre.replaceChildren(ansiLinesToFragment(block.ansiLines, block.plainLines));
      } else if (pre) {
        pre.remove();
        pre = null;
      }
    }
    return { type: 'step', bKey: block.bKey, sig: block.sig, el: box, btn, pre };
  }

  const more = (oldEntry && oldEntry.type === 'more') ? oldEntry.el : document.createElement('button');
  if (!oldEntry || oldEntry.type !== 'more') {
    more.type = 'button';
    more.className = 'hist-more-btn';
    more.addEventListener('click', () => {
      preserveHistScrollAround(paneEl, () => {
        if (st.openLongTurns.has(key)) st.openLongTurns.delete(key);
        else st.openLongTurns.add(key);
      }, more);
    });
  }
  more.textContent = block.expanded ? ('▴ 收起中间 ' + block.truncatedCount + ' 行') : ('▾ 展开中间 ' + block.truncatedCount + ' 行');
  return { type: 'more', bKey: block.bKey, sig: block.sig, el: more };
}

function preserveHistScrollAround(paneEl, mutate, anchorEl){
  const st = paneHistState.get(paneEl);
  if (!st || !st.listEl) { mutate(); renderHistList(paneEl); return; }
  const keepTop = st.listEl.scrollTop;
  const anchorBefore = anchorEl && anchorEl.isConnected ? anchorEl.getBoundingClientRect().top : null;
  st.suppressAutoScrollUntil = Date.now() + 320;
  mutate();
  renderHistList(paneEl);
  let targetTop = keepTop;
  if (anchorBefore !== null && anchorEl && anchorEl.isConnected) {
    const anchorAfter = anchorEl.getBoundingClientRect().top;
    targetTop = Math.max(0, keepTop + (anchorAfter - anchorBefore));
  }
  st.listEl.scrollTop = targetTop;
  st.stickToBottom = (st.listEl.scrollHeight - st.listEl.scrollTop - st.listEl.clientHeight) <= 8;
  const jumpBtn = st.root && st.root.querySelector('.hist-jump');
  if (jumpBtn) jumpBtn.hidden = st.stickToBottom;
  requestAnimationFrame(() => {
    st.listEl.scrollTop = targetTop;
    st.stickToBottom = (st.listEl.scrollHeight - st.listEl.scrollTop - st.listEl.clientHeight) <= 8;
    if (jumpBtn) jumpBtn.hidden = st.stickToBottom;
  });
}

function patchReplyHost(hostEl, turn, st, key, paneEl, prevEntries){
  hostEl.style.display = 'flex';
  hostEl.style.flexDirection = 'column';
  hostEl.style.gap = '6px';
  const nextBlocks = decomposeReplyBlocks(turn, st, key);
  const oldList = Array.isArray(prevEntries) ? prevEntries : [];
  const nextEntries = [];

  for (let idx = 0; idx < nextBlocks.length; idx++) {
    const blk = nextBlocks[idx];
    const old = idx < oldList.length && oldList[idx].type === blk.type && oldList[idx].bKey === blk.bKey ? oldList[idx] : null;
    const entry = createOrUpdateBlockEl(blk, old, st, key, paneEl);
    nextEntries.push(entry);
    const curNode = hostEl.children[idx];
    if (curNode !== entry.el) {
      hostEl.insertBefore(entry.el, curNode || null);
    }
  }
  while (hostEl.children.length > nextEntries.length) {
    hostEl.lastElementChild.remove();
  }
  return nextEntries;
}

function turnStateKey(t){
  return t.id || (t.index + ':' + t.summary.slice(0, 40));
}

async function sendRawToPane(paneEl, seq){
  const sess = paneEl && paneEl.dataset && paneEl.dataset.sess;
  if (sess) {
    try {
      const r = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s: sess, raw: seq }),
        cache: 'no-store',
        signal: AbortSignal.timeout(5000)
      });
      if (r.ok) return true;
    } catch (e) {}
    // A missing response does not mean the terminal did not receive the command.
    return false;
  }
  const f = paneEl && paneEl.querySelector('iframe');
  try {
    const win = f && f.contentWindow;
    const t = win && win.term;
    if (t && typeof t.input === 'function' && (!win.__wtSocket || win.__wtSocket.readyState === 1)) {
      t.input(seq, true);
      return true;
    }
  } catch (e) {}
  return false;
}

async function submitFromHist(paneEl, text){
  const sess = paneEl && paneEl.dataset && paneEl.dataset.sess;
  const payload = String(text || '').replace(/\r\n?/g, '\n');
  if (sess) {
    try {
      const r = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s: sess, text: payload }),
        cache: 'no-store',
        signal: AbortSignal.timeout(10000)
      });
      if (r.ok) return true;
    } catch (e) {}
    // A missing response does not mean the terminal did not receive the command.
    return false;
  }
  const f = paneEl && paneEl.querySelector('iframe');
  try {
    const win = f && f.contentWindow;
    const t = win && win.term;
    if (t) {
      if (win.__wtSocket && win.__wtSocket.readyState !== 1) return false;
      if (!payload) { if (typeof t.input === 'function') t.input('\r', true); return true; }
      if (typeof t.paste === 'function') t.paste(payload);
      else if (typeof t.input === 'function') t.input(payload, true);
      await new Promise(resolve => setTimeout(resolve, 60));
      if (win.__wtSocket && win.__wtSocket.readyState !== 1) return false;
      if (typeof t.input !== 'function') return false;
      t.input('\r', true);
      return true;
    }
  } catch (e) {}
  return false;
}

function pokeHistStream(sess){
  if (!sess) return;
  fetch('/history-poke?s=' + encodeURIComponent(sess), { method: 'POST', cache: 'no-store' }).catch(() => {});
}

function histSignature(d){
  if (!d) return '';
  // Include all visible content: equal-length edits and earlier turns can change too.
  return normalizeSpinners(JSON.stringify([d.historySource, d.threadId, d.cmd, d.agent, d.runningAgent, d.menuActive, d.model, d.cwd, d.banner, d.bannerAnsi, d.preamble, d.preambleAnsi, d.totalLines, d.turns]));
}

const DRAFT_PREFIX = 'wt_draft_v1:';
const INPUT_HIST_KEY = 'wt_input_hist_v1';
const INPUT_HIST_LIMIT = 160;
function loadInputHistory(){
  try {
    const arr = JSON.parse(localStorage.getItem(INPUT_HIST_KEY) || '[]');
    return Array.isArray(arr) ? arr.filter(x => typeof x === 'string' && x.trim()) : [];
  } catch (e) { return []; }
}
function pushInputHistory(text){
  const s = String(text || '').replace(/\r\n?/g, '\n');
  if (!s.trim()) return;
  try {
    const prev = loadInputHistory().filter(x => x !== s);
    prev.unshift(s);
    localStorage.setItem(INPUT_HIST_KEY, JSON.stringify(prev.slice(0, INPUT_HIST_LIMIT)));
  } catch (e) {}
}
function getCombinedInputHistory(st){
  const out = [];
  const seen = new Set();
  for (const item of loadInputHistory()) {
    if (!seen.has(item)) { seen.add(item); out.push(item); }
  }
  const turns = (st && st.data && Array.isArray(st.data.turns)) ? st.data.turns : [];
  for (let i = turns.length - 1; i >= 0; i--) {
    const p = String((turns[i] && turns[i].prompt) || '').replace(/\r\n?/g, '\n').trim();
    if (p && !seen.has(p)) { seen.add(p); out.push(p); }
  }
  return out;
}
