function isProcessLine(line){
  const t = line.trimStart();
  return /^(?:[○▸●•]\s+(?:Thought\b|Ran\b|Explored\b|Searched\b|Read\b|Edited\b|Wrote\b|Updated\b|Created\b|Deleted\b|Checked\b|Called\b)|Worked for\s+\d|•\s+[●└├│]|\s*└\s)/.test(t);
}

function isSubDetailLine(line){
  const t = line.trimStart();
  return !t || /^\s{2,}(?:└|\+|-\s|\.\.\.|ctrl\+o|\(\+\d+)/i.test(line) || /^\(\+\d+\s+lines?\)/i.test(t);
}

function terminalTaskState(agent, screen){
  if (screen.nativeMenu || screen.menuActive) return 'action';
  const lines = String(screen.text || '').replace(/\x1b\[[0-9;:?]*[ -/]*[@-~]/g, '').trimEnd().split('\n');
  const tail = lines.slice(-12).join('\n');
  if (agent === 'codex') {
    if (/\besc to interrupt\b/i.test(tail)) return 'running';
    if (lines.slice(-5).some(line => /^\s*›(?:[ \t]|$)/.test(line))) return 'input';
  }
  if (agent === 'agy') {
    if (/\besc to cancel\b/i.test(tail) || /^[\u2801-\u28ff]\s+\S/m.test(lines.slice(-6).join('\n'))) return 'running';
    if (/^\s*\? for shortcuts(?:[ \t]{2,}[^\n]+)?[ \t]*$/im.test(tail)) return 'input';
    if (/^─{12,}\n>\s*\n─{12,}/m.test(tail)) return 'input';
  }
  if (agent === 'claude') {
    if (/\besc to interrupt\b/i.test(tail)) return 'running';
    if (lines.slice(-5).some(line => /^\s*❯(?:[ \t]|$)/.test(line))) return 'input';
  }
  return '';
}

const TOKYO_BASE = ['#0a0a0c', '#e2708f', '#98b88c', '#ee9833', '#83b8ca', '#b8a1c9', '#cbb38f', '#d8d2c7'];
const TOKYO_BRIGHT = ['#5b6064', '#e2708f', '#98b88c', '#ee9833', '#83b8ca', '#b8a1c9', '#cbb38f', '#f1ece3'];

function xterm256ToRgb(n){
  n = n | 0;
  if (n < 0 || n > 255) return null;
  if (n < 8) return TOKYO_BASE[n];
  if (n < 16) return TOKYO_BRIGHT[n - 8];
  if (n < 232) {
    const idx = n - 16;
    const steps = [0, 95, 135, 175, 215, 255];
    const r = steps[Math.floor(idx / 36)];
    const g = steps[Math.floor((idx % 36) / 6)];
    const b = steps[idx % 6];
    return [r, g, b];
  }
  const v = 8 + (n - 232) * 10;
  return [v, v, v];
}

function formatAnsiBg(color){
  if (typeof color === 'string') return color;
  const [r, g, b] = color;
  // Soften dark gray terminal chips / prompt bars into translucent warm parchment glass pills.
  if (Math.max(r, g, b) <= 72 && Math.max(r, g, b) - Math.min(r, g, b) <= 16) {
    return 'rgba(241,236,227,0.08)';
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',0.32)';
}

function formatAnsiFg(color){
  if (typeof color === 'string') return color;
  return 'rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')';
}

function applySgrParams(paramsStr, state){
  const tokens = paramsStr === '' ? ['0'] : paramsStr.split(';');
  const applyBasic = (c) => {
    if (Number.isNaN(c) || c === 0) {
      state.fg = null; state.bg = null; state.bold = false; state.dim = false; state.italic = false; state.under = false; state.strike = false; state.inv = false;
    } else if (c === 1) state.bold = true;
    else if (c === 2) state.dim = true;
    else if (c === 3) state.italic = true;
    else if (c === 4) state.under = true;
    else if (c === 7) state.inv = true;
    else if (c === 9) state.strike = true;
    else if (c === 21 || c === 22) { state.bold = false; state.dim = false; }
    else if (c === 23) state.italic = false;
    else if (c === 24) state.under = false;
    else if (c === 27) state.inv = false;
    else if (c === 29) state.strike = false;
    else if (c >= 30 && c <= 37) state.fg = TOKYO_BASE[c - 30];
    else if (c === 39) state.fg = null;
    else if (c >= 90 && c <= 97) state.fg = TOKYO_BRIGHT[c - 90];
    else if (c >= 40 && c <= 47) state.bg = TOKYO_BASE[c - 40];
    else if (c === 49) state.bg = null;
    else if (c >= 100 && c <= 107) state.bg = TOKYO_BRIGHT[c - 100];
  };
  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    if (tok.includes(':')) {
      const sub = tok.split(':').map(x => x === '' ? 0 : parseInt(x, 10));
      const c = sub[0];
      if (c === 4) {
        state.under = sub[1] !== 0;
      } else if ((c === 38 || c === 48) && sub.length >= 2) {
        const mode = sub[1];
        if (mode === 5 && sub.length >= 3) {
          const col = xterm256ToRgb(sub[2]);
          if (c === 38) state.fg = col; else state.bg = col;
        } else if (mode === 2 && sub.length >= 5) {
          const off = sub.length >= 6 ? 3 : 2;
          const rgb = [sub[off] & 255, sub[off + 1] & 255, sub[off + 2] & 255];
          if (c === 38) state.fg = rgb; else state.bg = rgb;
        }
      } else {
        applyBasic(c);
      }
      continue;
    }
    const c = tok === '' ? 0 : parseInt(tok, 10);
    if ((c === 38 || c === 48) && i + 1 < tokens.length) {
      const mode = parseInt(tokens[i + 1], 10);
      if (mode === 5 && i + 2 < tokens.length) {
        const col = xterm256ToRgb(parseInt(tokens[i + 2], 10));
        if (c === 38) state.fg = col; else state.bg = col;
        i += 2;
        continue;
      } else if (mode === 2 && i + 4 < tokens.length) {
        const rgb = [parseInt(tokens[i + 2], 10) & 255, parseInt(tokens[i + 3], 10) & 255, parseInt(tokens[i + 4], 10) & 255];
        if (c === 38) state.fg = rgb; else state.bg = rgb;
        i += 4;
        continue;
      }
    }
    applyBasic(c);
  }
}

const LEADING_SPIN_RE = /^([ \t]*)(?:([\u2801-\u28ff◐◓◑◒◴◵◶◷])([ \t]+)|([✳✶✻✽✢])([ \t]+(?=\S+(?:ing\b|…)))|(•)([ \t]+(?=Working\s*\()))/;

function matchLeadingSpin(line){
  const m = String(line || '').match(LEADING_SPIN_RE);
  if (!m) return null;
  return { indent: m[1] || '', glyph: m[2] || m[4] || m[6] || '', gap: m[3] || m[5] || m[7] || '', len: m[0].length };
}

function makeSpinNode(){
  const sp = document.createElement('span');
  sp.className = 'wt-spin';
  sp.setAttribute('aria-hidden', 'true');
  return sp;
}

function ansiLinesToFragment(ansiLines, plainLines, opts){
  const exactBg = !!(opts && opts.exactBg);
  const frag = document.createDocumentFragment();
  const state = { fg: null, bg: null, bold: false, dim: false, italic: false, under: false, strike: false, inv: false };
  const escRe = /\x1b\[([0-9;:]*)([@-~])|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g;

  for (let li = 0; li < ansiLines.length; li++) {
    const rawLine = ansiLines[li] || '';
    const plainLine = plainLines ? (plainLines[li] || '') : rawLine;
    const hasEsc = rawLine.indexOf('\x1b') !== -1;
    let spinPending = !exactBg && !!matchLeadingSpin(plainLine);

    if (!hasEsc && !(state.fg || state.bg || state.bold || state.dim || state.italic || state.under || state.strike || state.inv)) {
      const suffix = li < ansiLines.length - 1 ? '\n' : '';
      let lineBody = rawLine;
      if (spinPending) {
        const sm = matchLeadingSpin(lineBody);
        if (sm) {
          if (sm.indent) frag.appendChild(document.createTextNode(sm.indent));
          frag.appendChild(makeSpinNode());
          lineBody = lineBody.slice(sm.len);
        }
      }
      const t = plainLine.trimStart();
      if (!exactBg && /^(?:○|▸)\s+Thought\b/.test(t)) {
        const sp = document.createElement('span');
        sp.className = 'hist-thought';
        sp.textContent = lineBody + suffix;
        frag.appendChild(sp);
      } else if (!exactBg && /^(?:[●•]\s+(?:Ran|Explored|Searched|Read|Edited|Wrote|Updated|Created|Deleted|Checked|Called)|Worked for\s+\d)/.test(t)) {
        const sp = document.createElement('span');
        sp.className = 'hist-step';
        sp.textContent = lineBody + suffix;
        frag.appendChild(sp);
      } else {
        frag.appendChild(document.createTextNode(lineBody + suffix));
      }
      continue;
    }

    escRe.lastIndex = 0;
    let last = 0;
    let m;
    let lineAtStart = true;
    const emitChunk = (txt) => {
      if (!txt) return;
      if (spinPending && lineAtStart) {
        const leadOnlySpaces = /^[ \t]+$/.test(txt);
        const sm = matchLeadingSpin(txt);
        if (sm) {
          if (sm.indent) frag.appendChild(document.createTextNode(sm.indent));
          frag.appendChild(makeSpinNode());
          txt = txt.slice(sm.len);
          spinPending = false;
          lineAtStart = false;
          if (!txt) return;
        } else if (!leadOnlySpaces) {
          const singleSpin = txt.match(/^([\u2801-\u28ff◐◓◑◒◴◵◶◷✳✶✻✽✢•])([ \t]*)$/);
          if (singleSpin) {
            frag.appendChild(makeSpinNode());
            spinPending = false;
            lineAtStart = false;
            return;
          }
          lineAtStart = false;
        }
      }
      if (txt.trim()) lineAtStart = false;
      const styled = state.fg || state.bg || state.bold || state.dim || state.italic || state.under || state.strike || state.inv;
      if (!styled) {
        frag.appendChild(document.createTextNode(txt));
        return;
      }
      const sp = document.createElement('span');
      const fgColor = state.inv ? (state.bg || '#15161e') : state.fg;
      const bgColor = state.inv ? (state.fg || '#f1ece3') : state.bg;
      if (fgColor) sp.style.color = formatAnsiFg(fgColor);
      if (bgColor) {
        if (exactBg) {
          sp.style.background = formatAnsiFg(bgColor);
        } else {
          sp.style.background = formatAnsiBg(bgColor);
          sp.className = 'ansi-pill';
        }
      }
      if (state.bold) sp.style.fontWeight = '600';
      if (state.dim) sp.classList.add('ansi-dim');
      if (state.italic) sp.style.fontStyle = 'italic';
      if (state.under || state.strike) {
        sp.style.textDecoration = [state.under ? 'underline' : '', state.strike ? 'line-through' : ''].filter(Boolean).join(' ');
      }
      sp.textContent = txt;
      frag.appendChild(sp);
    };

    while ((m = escRe.exec(rawLine)) !== null) {
      if (m.index > last) emitChunk(rawLine.slice(last, m.index));
      if (m[2] === 'm') applySgrParams(m[1], state);
      last = escRe.lastIndex;
    }
    if (last < rawLine.length) emitChunk(rawLine.slice(last));
    if (li < ansiLines.length - 1) frag.appendChild(document.createTextNode('\n'));
  }
  return frag;
}

function decomposeReplyBlocks(turn, st, key){
  let plainLines = String(turn.reply || '').split('\n');
  let ansiLines = String(turn.replyAnsi || turn.reply || '').split('\n');
  if (ansiLines.length !== plainLines.length) ansiLines = plainLines.slice();

  const totalLines = plainLines.length;
  const limit = HIST_FOLD_OVER_LINES;
  if (!st.seenTurnLines) st.seenTurnLines = new Map();
  const prevSeenLines = st.seenTurnLines.get(key);
  // If the user was already watching this turn stream below the fold limit,
  // do not suddenly collapse the middle out from under them when it crosses 120 lines.
  if (prevSeenLines !== undefined && prevSeenLines <= limit && totalLines > limit) {
    st.openLongTurns.add(key);
  }
  st.seenTurnLines.set(key, totalLines);
  const isFolded = totalLines > limit && !st.openLongTurns.has(key);
  const isExpandedLong = totalLines > limit && st.openLongTurns.has(key);
  const truncatedCount = totalLines > limit ? (totalLines - 36) : 0;

  const blocks = [];
  let blockIdx = 0;

  const pushSegment = (segPlain, segAnsi) => {
    let i = 0;
    let plainBuf = [], ansiBuf = [];
    const flushPlain = () => {
      if (!plainBuf.length) return;
      const p = plainBuf.slice();
      const a = ansiBuf.slice();
      blocks.push({
        type: 'text',
        bKey: key + '#t' + blocks.length,
        sig: a.join('\n'),
        plainLines: p,
        ansiLines: a
      });
      plainBuf = [];
      ansiBuf = [];
    };

    while (i < segPlain.length) {
      if (isProcessLine(segPlain[i])) {
        flushPlain();
        const blockPlain = [segPlain[i]];
        const blockAnsi = [segAnsi[i]];
        let sawTreeDetail = /^\s*[└├│]/.test(segPlain[i]);
        i++;
        while (i < segPlain.length) {
          const ln = segPlain[i];
          if (isProcessLine(ln)) {
            if (/^\s*[└├│]/.test(ln)) sawTreeDetail = true;
            blockPlain.push(ln);
            blockAnsi.push(segAnsi[i]);
            i++;
            continue;
          }
          if (!ln.trim()) {
            if (segPlain[i + 1] !== undefined && isProcessLine(segPlain[i + 1])) {
              blockPlain.push(ln);
              blockAnsi.push(segAnsi[i]);
              i++;
              continue;
            }
            break;
          }
          if (isSubDetailLine(ln) || (sawTreeDetail && /^\s{4,}\S/.test(ln))) {
            blockPlain.push(ln);
            blockAnsi.push(segAnsi[i]);
            i++;
            continue;
          }
          break;
        }
        while (blockPlain.length > 1 && !blockPlain[blockPlain.length - 1].trim()) {
          blockPlain.pop();
          blockAnsi.pop();
        }
        const bKey = key + '#s' + (blockIdx++);
        const stepOpen = !st.closedStepBlocks.has(bKey);
        blocks.push({
          type: 'step',
          bKey,
          stepOpen,
          sig: (stepOpen ? '1:' : '0:') + blockAnsi.join('\n'),
          plainLines: blockPlain,
          ansiLines: blockAnsi
        });
      } else {
        plainBuf.push(segPlain[i]);
        ansiBuf.push(segAnsi[i]);
        i++;
      }
    }
    flushPlain();
  };

  if (isFolded) {
    pushSegment(plainLines.slice(0, 12), ansiLines.slice(0, 12));
    blocks.push({
      type: 'more',
      bKey: key + '#more',
      sig: 'more:' + truncatedCount,
      truncatedCount,
      expanded: false
    });
    // Restore the terminal style at the tail boundary, including resets inside the omitted range.
    const tailStyle = (ansiLines.slice(0, -24).join('\n').match(/\x1b\[[0-9;:]*m/g) || []).join('');
    const tailPlain = plainLines.slice(-24);
    const tailAnsi = ansiLines.slice(-24);
    tailAnsi[0] = '\x1b[0m' + tailStyle + tailAnsi[0];
    pushSegment(tailPlain, tailAnsi);
  } else {
    pushSegment(plainLines, ansiLines);
    if (isExpandedLong) {
      blocks.push({
        type: 'more',
        bKey: key + '#less',
        sig: 'less:' + truncatedCount,
        truncatedCount,
        expanded: true
      });
    }
  }
  return blocks;
}

function createOrUpdateBlockEl(block, oldEntry, st, key, paneEl){
  if (block.type === 'text') {
    const el = (oldEntry && oldEntry.type === 'text') ? oldEntry.el : document.createElement('div');
    if (!oldEntry || oldEntry.type !== 'text') el.className = 'hist-reply';
    if (!oldEntry || oldEntry.sig !== block.sig) {
      const raw = block.ansiLines.join('\n');
      const plainText = !raw.includes('\x1b') && block.plainLines.every(line => !matchLeadingSpin(line) && !/^(?:○|▸)\s+Thought\b/.test(line.trimStart()));
      if (plainText) {
        if (el.childNodes.length === 1 && el.firstChild.nodeType === 3) el.firstChild.data = raw;
        else el.replaceChildren(document.createTextNode(raw));
      } else {
        el.replaceChildren(ansiLinesToFragment(block.ansiLines, block.plainLines));
      }
    }
    return { type: 'text', bKey: block.bKey, sig: block.sig, el };
  }

  if (block.type === 'step') {
    let box, btn, pre;
    const reuse = oldEntry && oldEntry.type === 'step' && oldEntry.bKey === block.bKey;
    if (reuse) {
      box = oldEntry.el;
      btn = oldEntry.btn;
      pre = oldEntry.pre;
    } else {
      box = document.createElement('div');
      box.className = 'hist-step-box';
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hist-step-toggle';
      btn.addEventListener('click', () => {
        preserveHistScrollAround(paneEl, () => {
          if (st.closedStepBlocks.has(block.bKey)) st.closedStepBlocks.delete(block.bKey);
          else st.closedStepBlocks.add(block.bKey);
        }, btn);
      });
      box.appendChild(btn);
      pre = null;
    }
    if (!reuse || oldEntry.sig !== block.sig) {
      const firstLine = block.plainLines[0].trim();
      const firstSum = firstLine.slice(0, 72);
      const countSuffix = block.plainLines.length > 1 ? ' · ' + block.plainLines.length + '行' : '';
      const sm = matchLeadingSpin(firstLine);
      btn.setAttribute('aria-expanded', String(block.stepOpen));
      btn.replaceChildren();
      btn.appendChild(document.createTextNode(block.stepOpen ? '▾ ' : '▸ '));
      if (sm) btn.appendChild(makeSpinNode());
      btn.appendChild(document.createTextNode((sm ? firstSum.slice(sm.len) : firstSum) + countSuffix));

      if (block.stepOpen) {
        if (!pre) {
          pre = document.createElement('pre');
          pre.className = 'hist-step-pre';
          box.appendChild(pre);
        }
        pre.replaceChildren(ansiLinesToFragment(block.ansiLines, block.plainLines));
      } else if (pre) {
        pre.remove();
        pre = null;
      }
    }
    return { type: 'step', bKey: block.bKey, sig: block.sig, el: box, btn, pre };
  }

  const more = (oldEntry && oldEntry.type === 'more') ? oldEntry.el : document.createElement('button');
  if (!oldEntry || oldEntry.type !== 'more') {
    more.type = 'button';
    more.className = 'hist-more-btn';
    more.addEventListener('click', () => {
      preserveHistScrollAround(paneEl, () => {
        if (st.openLongTurns.has(key)) st.openLongTurns.delete(key);
        else st.openLongTurns.add(key);
      }, more);
    });
  }
  more.textContent = block.expanded ? ('▴ 收起中间 ' + block.truncatedCount + ' 行') : ('▾ 展开中间 ' + block.truncatedCount + ' 行');
  return { type: 'more', bKey: block.bKey, sig: block.sig, el: more };
}

function histDistanceFromBottom(st){
  return st.listEl.scrollHeight - st.listEl.clientHeight - Math.max(0, st.listEl.scrollTop);
}

function histCanScroll(st){
  return st.listEl.scrollHeight > st.listEl.clientHeight + 8;
}

function syncHistJump(st){
  st.jumpEl.hidden = !histCanScroll(st) || (st.stickToBottom && histDistanceFromBottom(st) <= 8);
}

function setHistScrollTop(st, top){
  const previousTop = st.listEl.scrollTop;
  st.listEl.scrollTop = top;
  if (previousTop !== st.listEl.scrollTop) st.appliedScrollTop = st.listEl.scrollTop;
}

function preserveHistScrollAround(paneEl, mutate, anchorEl){
  const st = paneHistState.get(paneEl);
  if (!st || !st.listEl) { mutate(); renderHistList(paneEl); return; }
  const keepTop = st.listEl.scrollTop;
  const anchorBefore = anchorEl?.isConnected ? anchorEl.getBoundingClientRect().top : null;
  st.suppressAutoScrollUntil = Date.now() + 320;
  mutate();
  renderHistList(paneEl);
  const shift = anchorBefore !== null && anchorEl.isConnected ? anchorEl.getBoundingClientRect().top - anchorBefore : 0;
  setHistScrollTop(st, keepTop + shift);
  st.stickToBottom = histDistanceFromBottom(st) <= 8;
  syncHistJump(st);
}

function patchReplyHost(hostEl, turn, st, key, paneEl, prevEntries){
  hostEl.style.display = 'flex';
  hostEl.style.flexDirection = 'column';
  hostEl.style.gap = '6px';
  const nextBlocks = decomposeReplyBlocks(turn, st, key);
  const oldList = Array.isArray(prevEntries) ? prevEntries : [];
  const nextEntries = [];

  for (let idx = 0; idx < nextBlocks.length; idx++) {
    const blk = nextBlocks[idx];
    const old = idx < oldList.length && oldList[idx].type === blk.type && oldList[idx].bKey === blk.bKey ? oldList[idx] : null;
    const entry = createOrUpdateBlockEl(blk, old, st, key, paneEl);
    nextEntries.push(entry);
    const curNode = hostEl.children[idx];
    if (curNode !== entry.el) {
      hostEl.insertBefore(entry.el, curNode || null);
    }
  }
  while (hostEl.children.length > nextEntries.length) {
    hostEl.lastElementChild.remove();
  }
  return nextEntries;
}

function turnStateKey(t){
  return t.id || (t.index + ':' + t.summary.slice(0, 40));
}

async function sendRawToPane(paneEl, seq){
  const sess = paneEl && paneEl.dataset && paneEl.dataset.sess;
  if (sess) {
    try {
      const r = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s: sess, raw: seq }),
        cache: 'no-store',
        signal: AbortSignal.timeout(5000)
      });
      if (r.ok) return true;
    } catch (e) {}
    // A missing response does not mean the terminal did not receive the command.
    return false;
  }
  const f = paneEl && paneEl.querySelector('iframe');
  try {
    const win = f && f.contentWindow;
    const t = win && win.term;
    if (t && typeof t.input === 'function' && (!win.__wtSocket || win.__wtSocket.readyState === 1)) {
      t.input(seq, true);
      return true;
    }
  } catch (e) {}
  return false;
}

async function submitFromHist(paneEl, text){
  const sess = paneEl && paneEl.dataset && paneEl.dataset.sess;
  const payload = String(text || '').replace(/\r\n?/g, '\n');
  if (sess) {
    try {
      const r = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ s: sess, text: payload }),
        cache: 'no-store',
        signal: AbortSignal.timeout(10000)
      });
      if (r.ok) return true;
    } catch (e) {}
    // A missing response does not mean the terminal did not receive the command.
    return false;
  }
  const f = paneEl && paneEl.querySelector('iframe');
  try {
    const win = f && f.contentWindow;
    const t = win && win.term;
    if (t) {
      if (win.__wtSocket && win.__wtSocket.readyState !== 1) return false;
      if (!payload) { if (typeof t.input === 'function') t.input('\r', true); return true; }
      if (typeof t.paste === 'function') t.paste(payload);
      else if (typeof t.input === 'function') t.input(payload, true);
      await new Promise(resolve => setTimeout(resolve, 60));
      if (win.__wtSocket && win.__wtSocket.readyState !== 1) return false;
      if (typeof t.input !== 'function') return false;
      t.input('\r', true);
      return true;
    }
  } catch (e) {}
  return false;
}

function pokeHistStream(sess){
  if (!sess) return;
  fetch('/history-poke?s=' + encodeURIComponent(sess), { method: 'POST', cache: 'no-store' }).catch(() => {});
}

function histSignature(d){
  if (!d) return '';
  if (d.digest) return d.digest;
  // Include all visible content: equal-length edits and earlier turns can change too.
  return JSON.stringify([d.historySource, d.threadId, d.cmd, d.agent, d.runningAgent, d.menuActive, d.menuCloseKey, d.slashOutput, d.slashOutputAnsi, d.model, d.cwd, d.banner, d.bannerAnsi, d.preamble, d.preambleAnsi, d.totalLines, d.turns]);
}

const DRAFT_PREFIX = 'wt_draft_v1:';
const INPUT_HIST_KEY = 'wt_input_hist_v1';
const INPUT_HIST_LIMIT = 160;
function loadInputHistory(){
  try {
    const arr = JSON.parse(localStorage.getItem(INPUT_HIST_KEY) || '[]');
    return Array.isArray(arr) ? arr.filter(x => typeof x === 'string' && x.trim()) : [];
  } catch (e) { return []; }
}
function pushInputHistory(text){
  const s = String(text || '').replace(/\r\n?/g, '\n');
  if (!s.trim()) return;
  try {
    const prev = loadInputHistory().filter(x => x !== s);
    prev.unshift(s);
    localStorage.setItem(INPUT_HIST_KEY, JSON.stringify(prev.slice(0, INPUT_HIST_LIMIT)));
  } catch (e) {}
}
function getCombinedInputHistory(st){
  const out = [];
  const seen = new Set();
  for (const item of loadInputHistory()) {
    if (!seen.has(item)) { seen.add(item); out.push(item); }
  }
  const turns = (st && st.data && Array.isArray(st.data.turns)) ? st.data.turns : [];
  for (let i = turns.length - 1; i >= 0; i--) {
    const p = String((turns[i] && turns[i].prompt) || '').replace(/\r\n?/g, '\n').trim();
    if (p && !seen.has(p)) { seen.add(p); out.push(p); }
  }
  return out;
}

function buildSlashItems(effAgent, query){
  const q = String(query || '').toLowerCase();
  const agentKey = String(effAgent || '').toLowerCase();
  const merged = new Map();
  const addList = (list) => {
    for (const [cmd, desc, hasArgs] of list || []) {
      if (!merged.has(cmd)) merged.set(cmd, { cmd, desc, hasArgs });
    }
  };
  addList(SLASH_CATALOG[agentKey]);
  if (!SLASH_CATALOG[agentKey]) return [];
  if (agentKey === 'claude') addList(SLASH_CATALOG.common.filter(([cmd]) => ['/help','/model','/compact','/clear','/resume','/init','/context','/cost','/mcp','/memory','/doctor','/agents','/exit'].includes(cmd)));
  const scored = [];
  for (const entry of merged.values()) {
    const cLow = entry.cmd.toLowerCase();
    const dLow = entry.desc.toLowerCase();
    let rank = 99;
    if (cLow === q) rank = 0;
    else if (cLow.startsWith(q)) rank = 1;
    else if (cLow.includes(q.slice(1))) rank = 2;
    else if (q.length > 1 && dLow.includes(q.slice(1))) rank = 3;
    else continue;
    scored.push({
      rank,
      kind: 'slash',
      badge: 'CMD',
      label: entry.cmd,
      desc: entry.desc,
      insert: entry.cmd + (entry.hasArgs ? ' ' : '')
    });
  }
  scored.sort((a, b) => a.rank - b.rank || a.label.localeCompare(b.label));
  return scored;
}

function longestCommonPrefix(strs){
  if (!strs || !strs.length) return '';
  let prefix = strs[0];
  for (let i = 1; i < strs.length; i++) {
    while (prefix && !strs[i].startsWith(prefix)) prefix = prefix.slice(0, -1);
    if (!prefix) break;
  }
  return prefix;
}

const pathAcCache = new Map();
async function fetchPathItems(sess, token, signal){
  const key = sess + '|' + token;
  const cached = pathAcCache.get(key);
  if (cached && (Date.now() - cached.ts) < 2000) return cached.items;
  const r = await fetch('/complete?s=' + encodeURIComponent(sess) + '&q=' + encodeURIComponent(token), { cache: 'no-store', signal });
  if (!r.ok) return [];
  const j = await r.json();
  const items = Array.isArray(j && j.items) ? j.items.map(it => ({
    kind: it.kind === 'dir' ? 'dir' : 'file',
    badge: it.kind === 'dir' ? 'DIR' : 'FILE',
    label: it.label,
    desc: it.detail || '',
    insert: it.insert
  })) : [];
  if (pathAcCache.size >= 80) pathAcCache.delete(pathAcCache.keys().next().value);
  pathAcCache.set(key, { ts: Date.now(), items });
  return items;
}

function saveHistDraft(st){
  if (!st || !st.sess) return;
  try {
    const key = DRAFT_PREFIX + st.sess;
    if (!st.inputEl.value && !st.quotes.length) sessionStorage.removeItem(key);
    else sessionStorage.setItem(key, JSON.stringify({text: st.inputEl.value, quotes: st.quotes, quoteSeq: st.quoteSeq}));
  } catch (e) {}
}
function restoreHistDraft(st){
  try {
    const d = JSON.parse(sessionStorage.getItem(DRAFT_PREFIX + st.sess) || 'null');
    if (!d) return;
    st.inputEl.value = typeof d.text === 'string' ? d.text : '';
    st.quotes = Array.isArray(d.quotes) ? d.quotes.filter(q => q && typeof q.text === 'string') : [];
    st.quoteSeq = Math.max(Number(d.quoteSeq) || 0, ...st.quotes.map(q => Number(q.id) || 0));
  } catch (e) {}
}

function formatQuotedSubmission(quotes, comment){
  const parts = [];
  for (const q of quotes || []) {
    const lines = String(q.text || '').replace(/\r\n?/g, '\n').split('\n');
    const block = lines.map(l => '> ' + l).join('\n');
    if (block.trim()) parts.push(block);
  }
  const c = String(comment || '').replace(/\r\n?/g, '\n').trim();
  if (c) parts.push(c);
  return parts.join('\n\n');
}

function renderQuoteChips(st){
  saveHistDraft(st);
  st.quotesEl.innerHTML = '';
  if (!st.quotes.length) {
    st.quotesEl.classList.remove('on');
    return;
  }
  st.quotesEl.classList.add('on');
  for (const q of st.quotes) {
    const chip = document.createElement('div');
    chip.className = 'hist-quote-chip';
    chip.title = q.text;
    const txt = document.createElement('span');
    txt.className = 'hist-quote-txt';
    const oneLine = q.text.replace(/\s+/g, ' ').trim();
    txt.textContent = (q.turnIndex ? '#' + q.turnIndex + ' · ' : '') + oneLine;
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'hist-quote-del';
    del.textContent = '×';
    del.title = '移除引用';
    del.addEventListener('click', () => {
      st.quotes = st.quotes.filter(x => x.id !== q.id);
      renderQuoteChips(st);
      st.inputEl.focus({ preventScroll: true });
    });
    chip.append(txt, del);
    st.quotesEl.appendChild(chip);
  }
}

function isSelectingInList(st){
  const sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount || !sel.toString()) return false;
  try {
    const anc = sel.getRangeAt(0).commonAncestorContainer;
    const ancEl = anc.nodeType === 1 ? anc : anc.parentElement;
    return !!(ancEl && st.listEl.contains(ancEl));
  } catch (e) {
    return false;
  }
}

function makeAgentBannerCard(agent, model, cwd, bannerPlain){
  const names = {
    codex: 'OpenAI Codex',
    agy: 'Antigravity CLI',
    claude: 'Claude Code',
    opencode: 'opencode',
    hermes: 'Hermes Agent',
    kimi: 'Kimi CLI',
    gemini: 'Gemini CLI'
  };
  const card = document.createElement('div');
  card.className = 'hist-agent-card';
  const ico = document.createElement('span');
  ico.className = 'hist-agent-ico';
  ico.innerHTML = agentBrandSvg(agent);

  const body = document.createElement('div');
  body.className = 'hist-agent-body';
  const top = document.createElement('div');
  top.className = 'hist-agent-top';

  const name = document.createElement('span');
  name.className = 'hist-agent-name';
  name.textContent = names[agent] || agent || 'CLI Agent';
  top.appendChild(name);

  let modelText = model || '';
  if (!modelText && bannerPlain && agent !== 'codex' && agent !== 'agy') {
    const m = bannerPlain.match(/·\s*([^\n]+)$/);
    if (m) modelText = m[1].trim();
  }
  if (modelText) {
    const badge = document.createElement('span');
    badge.className = 'hist-agent-model';
    badge.textContent = modelText;
    top.appendChild(badge);
  }
  body.appendChild(top);

  const cwdText = cwd || (bannerPlain && bannerPlain.split('\n').slice(1).join(' ').trim()) || '';
  if (cwdText) {
    const sub = document.createElement('div');
    sub.className = 'hist-agent-cwd';
    sub.textContent = cwdText;
    body.appendChild(sub);
  }
  card.append(ico, body);
  return card;
}

function renderHistList(paneEl){
  const st = paneHistState.get(paneEl);
  if (!st || !st.data) return;
  const { sess, cmd, agent = '', model = '', cwd = '', banner = '', bannerAnsi = '', bannerCaptured = false, turns = [], preamble = '', preambleAnsi = '', totalLines = 0 } = st.data;
  const effAgent = st.data.runningAgent || agent || cmd || '';
  const agentChanged = st.root.dataset.agent !== effAgent;
  st.root.dataset.cmd = cmd || '';
  st.root.dataset.agent = effAgent;
  if (agentChanged && st.refreshAutocomplete) st.refreshAutocomplete(true);
  const q = st.searchEl.value.trim().toLowerCase();
  const filtered = q
    ? turns.filter(t => (t.prompt + '\n' + t.reply).toLowerCase().includes(q))
    : turns;

  st.titleEl.textContent = 'wt-' + (sess || (paneEl.dataset && paneEl.dataset.sess) || '') + (effAgent ? ' · ' + effAgent : '');
  if (st.modelEl) {
    st.modelEl.textContent = model || '';
    st.modelEl.title = model || '';
    st.modelEl.hidden = !model;
  }

  const bannerRaw = String(bannerAnsi || banner || '');
  const bannerPlain = String(banner || '');
  const showAgentStatus = effAgent === 'codex' || effAgent === 'agy';
  const hasPixelArt = Boolean(!showAgentStatus && bannerCaptured && /[▄▀█▐▛▜▝▘☤]/.test(bannerPlain));
  const showBanner = showAgentStatus || Boolean((bannerRaw || effAgent) && filtered.length);
  const nextBannerSig = showBanner ? (hasPixelArt ? ('art:' + bannerRaw) : ('card:' + effAgent + '|' + model + '|' + cwd)) : '';
  if (st.bannerEl && st.bannerSig !== nextBannerSig) {
    if (showBanner) {
      if (hasPixelArt) {
        const pre = document.createElement('pre');
        pre.className = 'hist-banner-pre';
        const bPlain = bannerPlain.split('\n');
        const bAnsi = bannerRaw.split('\n');
        pre.appendChild(ansiLinesToFragment(bAnsi.length === bPlain.length ? bAnsi : bPlain, bPlain, { exactBg: true }));
        st.bannerEl.replaceChildren(pre);
      } else {
        st.bannerEl.replaceChildren(makeAgentBannerCard(effAgent, model, cwd, bannerPlain));
      }
      st.bannerEl.classList.add('on');
    } else {
      st.bannerEl.replaceChildren();
      st.bannerEl.classList.remove('on');
    }
    st.bannerSig = nextBannerSig;
  }

  if (!filtered.length) {
    if (st.olderHostEl && st.olderSig !== '') {
      st.olderHostEl.replaceChildren();
      st.olderHostEl.classList.remove('on');
      st.olderSig = '';
    }
    st.dom = null;
    st.listEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'hist-empty';
    if (q) {
      empty.textContent = '没有匹配「' + st.searchEl.value.trim() + '」的对话';
    } else if (st.data.menuActive) {
      if (!showBanner) st.listEl.appendChild(makeAgentBannerCard(effAgent, model, cwd, bannerPlain));
      empty.textContent = '终端菜单已打开，请在下方功能面板中选择；Esc 返回。';
    } else if (showAgentStatus) {
      empty.textContent = '暂未识别到对话，可在原终端查看当前输出。';
    } else if (agent && !bannerCaptured && /[╭╰].*(?:zts|[>❯])/m.test(preamble)) {
      st.listEl.appendChild(makeAgentBannerCard(effAgent, model, cwd, bannerPlain));
      empty.textContent = '等待新对话。启动状态可在“查看原终端画面”查看。';
    } else if (preamble) {
      const pre = document.createElement('pre');
      pre.className = 'hist-reply';
      pre.style.textAlign = 'left';
      const pPlain = String(preamble).split('\n');
      const pAnsi = String(preambleAnsi || preamble).split('\n');
      pre.appendChild(ansiLinesToFragment(pAnsi.length === pPlain.length ? pAnsi : pPlain, pPlain, { exactBg: true }));
      st.listEl.appendChild(pre);
      return;
    } else {
      empty.textContent = '暂无对话（' + totalLines + ' 行）';
    }
    st.listEl.appendChild(empty);
    return;
  }

  const latestTurn = filtered[filtered.length - 1];
  const latestKey = turnStateKey(latestTurn);
  let activeTurn = null;
  if (st.followLatest) {
    activeTurn = latestTurn;
  } else {
    activeTurn = filtered.find(t => turnStateKey(t) === st.selectedKey) || null;
    if (!activeTurn && st.selectedAnchor) {
      const a = st.selectedAnchor;
      activeTurn = filtered.find(t => a.promptPrefix && String(t.prompt || '').slice(0, 80) === a.promptPrefix)
        || filtered.find(t => a.summary && t.summary === a.summary)
        || null;
    }
    if (!activeTurn) {
      activeTurn = latestTurn;
      st.followLatest = true;
      st.selectedAnchor = null;
    }
  }
  st.selectedKey = turnStateKey(activeTurn);
  const activeKey = st.selectedKey;
  const olderTurns = filtered.length > 1 ? filtered : [];
  const showList = !!q || st.showOlder;
  const isLatest = activeKey === latestKey;
  const promptSig = activeTurn.promptAnsi || activeTurn.prompt || '';

  // Render the older-turns drawer in its fixed host above .hist-list so streaming never destroys it or hides it off-scroll.
  const nextOlderSig = olderTurns.length > 1
    ? [st.data.historySource, st.data.threadId, showList ? '1' : '0', q, activeKey, olderTurns.map(t => t.index + ':' + t.summary).join('\n')].join('|')
    : '';
  if (st.olderHostEl && st.olderSig !== nextOlderSig) {
    if (!nextOlderSig) {
      st.olderHostEl.replaceChildren();
      st.olderHostEl.classList.remove('on');
    } else {
      const prevOlderList = st.olderHostEl.querySelector('.hist-older-list');
      const keepOlderTop = prevOlderList ? prevOlderList.scrollTop : 0;
      const olderWrap = document.createElement('div');
      olderWrap.className = 'hist-older';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'hist-older-toggle';
      toggle.setAttribute('aria-expanded', String(showList));
      toggle.textContent = (showList ? '▾ ' : '▸ ') + (q ? '匹配 ' + filtered.length + ' 轮' : (st.data.historySource === 'codex-rollout' ? '全部对话 · ' : '终端可见对话 · ') + olderTurns.length + ' 轮');
      toggle.addEventListener('click', () => {
        st.showOlder = !st.showOlder;
        renderHistList(paneEl);
      });
      olderWrap.appendChild(toggle);

      if (showList) {
        const list = document.createElement('div');
        list.className = 'hist-older-list';
        for (const t of olderTurns) {
          const k = turnStateKey(t);
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'hist-older-row' + (k === activeKey ? ' active' : '');
          const num = document.createElement('span');
          num.className = 'hist-older-num';
          num.textContent = '#' + t.index;
          const txt = document.createElement('span');
          txt.className = 'hist-older-txt';
          txt.textContent = t.summary || '(无正文)';
          row.append(num, txt);
          row.addEventListener('click', () => {
            st.suppressAutoScrollUntil = k === latestKey ? 0 : (Date.now() + 260);
            st.selectedKey = k;
            st.stickToBottom = k === latestKey;
            if (k === latestKey) {
              st.followLatest = true;
              st.selectedAnchor = null;
            } else {
              st.followLatest = false;
              st.selectedAnchor = { index: t.index, summary: t.summary, promptPrefix: String(t.prompt || '').slice(0, 80) };
            }
            if (!q) st.showOlder = false;
            renderHistList(paneEl);
            st.listEl.scrollTop = (k === latestKey) ? st.listEl.scrollHeight : 0;
            syncHistJump(st);
          });
          list.appendChild(row);
        }
        olderWrap.appendChild(list);
        st.olderHostEl.replaceChildren(olderWrap);
        st.olderHostEl.classList.add('on');
        list.scrollTop = keepOlderTop;
      } else {
        st.olderHostEl.replaceChildren(olderWrap);
        st.olderHostEl.classList.add('on');
      }
    }
    st.olderSig = nextOlderSig;
  }

  // Reuse outer structure during streaming updates (even if scrollback shifts turn indices)
  // so earlier lines and scroll position never flicker or jump to top.
  const sameTurnDom = Boolean(
    st.dom &&
    st.dom.isLatest === isLatest &&
    st.dom.q === q &&
    (st.dom.activeKey === activeKey || (isLatest && st.dom.promptSig === promptSig))
  );
  if (sameTurnDom) {
    st.dom.activeKey = activeKey;
    st.dom.turnWrapEl.dataset.turnIdx = String(activeTurn.index);
    if (st.dom.promptSig !== promptSig) {
      const prPlain = String(activeTurn.prompt || '').split('\n');
      const prAnsi = String(activeTurn.promptAnsi || activeTurn.prompt || '').split('\n');
      st.dom.promptEl.replaceChildren(ansiLinesToFragment(prAnsi.length === prPlain.length ? prAnsi : prPlain, prPlain));
      st.dom.promptSig = promptSig;
    }
    st.dom.replyText = String(activeTurn.reply || '');
    if (activeTurn.reply) {
      if (!st.dom.replyHostEl) {
        st.dom.replyHostEl = document.createElement('div');
        st.dom.turnWrapEl.insertBefore(st.dom.replyHostEl, st.dom.copyRowEl || null);
      }
      st.dom.blocks = patchReplyHost(st.dom.replyHostEl, activeTurn, st, activeKey, paneEl, st.dom.blocks);
      if (st.dom.copyRowEl) st.dom.copyRowEl.hidden = false;
    } else if (st.dom.replyHostEl) {
      st.dom.replyHostEl.remove();
      st.dom.replyHostEl = null;
      st.dom.blocks = [];
      if (st.dom.copyRowEl) st.dom.copyRowEl.hidden = true;
    }
    return;
  }

  const frag = document.createDocumentFragment();

  const turnWrap = document.createElement('div');
  turnWrap.className = 'hist-turn';
  turnWrap.dataset.turnIdx = String(activeTurn.index);

  if (!isLatest) {
    const meta = document.createElement('div');
    meta.className = 'hist-turn-meta';
    const lbl = document.createElement('span');
    lbl.textContent = '正在查看第 #' + activeTurn.index + ' 轮';
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'hist-back-latest';
    back.textContent = '回到最新轮 ↘';
    back.addEventListener('click', () => {
      st.suppressAutoScrollUntil = 0;
      st.followLatest = true;
      st.stickToBottom = true;
      st.selectedAnchor = null;
      st.selectedKey = latestKey;
      renderHistList(paneEl);
      st.listEl.scrollTop = st.listEl.scrollHeight;
      syncHistJump(st);
    });
    meta.append(lbl, back);
    turnWrap.appendChild(meta);
  }

  const pr = document.createElement('div');
  pr.className = 'hist-prompt';
  const prPlain = String(activeTurn.prompt || '').split('\n');
  const prAnsi = String(activeTurn.promptAnsi || activeTurn.prompt || '').split('\n');
  pr.appendChild(ansiLinesToFragment(prAnsi.length === prPlain.length ? prAnsi : prPlain, prPlain));
  turnWrap.appendChild(pr);

  let replyHostEl = null;
  let blocks = [];
  if (activeTurn.reply) {
    replyHostEl = document.createElement('div');
    blocks = patchReplyHost(replyHostEl, activeTurn, st, activeKey, paneEl, null);
    turnWrap.appendChild(replyHostEl);
  }

  const copyRowEl = document.createElement('div');
  copyRowEl.className = 'hist-copy-row';
  copyRowEl.hidden = !activeTurn.reply;
  const copyReplyBtn = document.createElement('button');
  copyReplyBtn.type = 'button';
  copyReplyBtn.className = 'hist-copy-btn';
  copyReplyBtn.textContent = '复制本轮回复';
  copyReplyBtn.addEventListener('click', () => {
    const txt = (st.dom && st.dom.replyText) || String(activeTurn.reply || '');
    if (!copyTextTop(txt)) toast('复制失败，请使用系统复制');
  });
  copyRowEl.appendChild(copyReplyBtn);
  turnWrap.appendChild(copyRowEl);

  frag.appendChild(turnWrap);
  st.listEl.replaceChildren(frag);
  st.dom = {
    activeKey,
    isLatest,
    q,
    turnWrapEl: turnWrap,
    promptEl: pr,
    promptSig,
    replyHostEl,
    copyRowEl,
    replyText: String(activeTurn.reply || ''),
    blocks
  };
}

function applyHistData(paneEl, nextData, applyScroll = false, silent = true){
  const st = ensureHistOverlay(paneEl);
  const nextSig = histSignature(nextData);
  if (st.data && isSelectingInList(st)) { st.pendingData = nextData; return; }
  st.pendingData = null;
  if (silent && nextSig === st.lastSig) return;

  const wasFollowing = st.stickToBottom && histDistanceFromBottom(st) <= 8;
  const keepTop = st.listEl.scrollTop;
  const sourceChanged = st.data && (st.data.threadId !== nextData.threadId || st.data.historySource !== nextData.historySource);
  if (sourceChanged) {
    st.seenTurnLines?.clear();
    st.openLongTurns.clear();
    st.closedStepBlocks.clear();
    st.dom = null;
    st.followLatest = true;
    st.selectedAnchor = null;
  }
  const menuChanged = Boolean(nextData.menuActive) !== Boolean(st.data?.menuActive) || nextData.menuActive !== st.data?.menuActive || nextData.menuCloseKey !== st.data?.menuCloseKey;
  st.data = nextData;
  if (menuChanged) {
    st.rawMenuHeading = '';
    if (!nextData.menuActive) st.renderNativeMenu(null);
    st.refreshLive(true);
  }
  st.renderSlashOutput?.(nextData.slashOutput, nextData.slashOutputAnsi);
  st.lastSig = nextSig;
  const turns = nextData.turns || [];
  if (st.seenTurnLines) {
    const currentKeys = new Set(turns.map(turnStateKey));
    for (const key of st.seenTurnLines.keys()) {
      if (!currentKeys.has(key)) {
        st.seenTurnLines.delete(key);
        st.openLongTurns.delete(key);
      }
    }
  }

  if (st.followLatest || !st.selectedKey) {
    st.selectedKey = turns.length ? turnStateKey(turns[turns.length - 1]) : null;
  }
  renderHistList(paneEl);
  const onLatest = Boolean(st.dom?.isLatest);
  const suppressFollow = Date.now() < (st.suppressAutoScrollUntil || 0);
  st.stickToBottom = !suppressFollow && (applyScroll || (onLatest && wasFollowing));
  setHistScrollTop(st, st.stickToBottom ? st.listEl.scrollHeight : keepTop);
  syncHistJump(st);
}

function isOpenHistOverlay(paneEl, st){
  return Boolean(st && paneEl.isConnected && paneEl.dataset.sess === st.sess &&
    paneHistState.get(paneEl) === st && st.root.classList.contains('open'));
}

async function refreshHistPane(paneEl, applyScroll = true, silent = false, retry = 0){
  const st = paneHistState.get(paneEl);
  if (!isOpenHistOverlay(paneEl, st)) return;
  if (!silent && !st.data) {
    st.titleEl.textContent = '加载中…';
    if (!st.listEl.childElementCount) {
      st.listEl.innerHTML = '<div class="hist-skel" aria-hidden="true"><div class="hist-skel-bar s1"></div><div class="hist-skel-bar s2"></div><div class="hist-skel-bar s3"></div></div>';
    }
  }
  const revision = st.streamRevision || 0;
  const requestId = st.refreshId = (st.refreshId || 0) + 1;
  const isCurrent = () => isOpenHistOverlay(paneEl, st) &&
    requestId === st.refreshId && revision === (st.streamRevision || 0);
  try {
    const useProbe = !st.data && retry < 12;
    const r = await fetch('/history?s=' + encodeURIComponent(paneEl.dataset.sess) + (useProbe ? '&probe=1' : ''), { cache: 'no-store', signal: AbortSignal.timeout(15000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const nextData = await r.json();
    if (!isCurrent()) return;
    if (nextData && nextData.pending && retry < 12) {
      setTimeout(() => {
        if (isCurrent()) refreshHistPane(paneEl, applyScroll, silent, retry + 1);
      }, 350);
      return;
    }
    applyHistData(paneEl, nextData, applyScroll, silent);
    if (retry > 0) openHistStream(paneEl);
  } catch (err) {
    if (silent || !isCurrent()) return;
    if (st.data) {
      toast('刷新失败，已保留当前对话');
      return;
    }
    st.titleEl.textContent = '读取失败';
    const errorEl = document.createElement('div');
    errorEl.className = 'hist-empty';
    errorEl.textContent = '读取历史失败：' + String(err.message || err);
    st.listEl.replaceChildren(errorEl);
  }
}

function closeHistStream(paneEl){
  const st = paneHistState.get(paneEl);
  if (!st) return;
  if (st.streamFrame) cancelAnimationFrame(st.streamFrame);
  st.streamFrame = 0;
  st.nextStreamData = null;
  st.streamSnapshot = null;
  if (st && st.es) {
    try { st.es.close(); } catch (e) {}
    st.es = null;
    st.esSess = '';
  }
}

function disposeHistOverlay(paneEl){
  closeHistStream(paneEl);
  const st = paneHistState.get(paneEl);
  if (!st) return;
  saveHistDraft(st);
  clearInterval(st.liveTimer);
  clearTimeout(st.acTimer);
  st.acAbort?.abort();
  st.resizeObserver?.disconnect();
  document.removeEventListener('selectionchange', st.onSelectionChange);
  paneHistState.delete(paneEl);
}

function openHistStream(paneEl){
  const st = ensureHistOverlay(paneEl);
  const sess = paneEl && paneEl.dataset && paneEl.dataset.sess;
  if (!sess || isWebtermPaused() || !window.EventSource) return;
  const netMode = wtNet.sseMode();
  if (st.es && st.esSess === sess && st.es.readyState !== 2 &&
      (st.esNetMode === netMode || st.es.readyState === 0 || !wtNet.modeSettled())) return;
  closeHistStream(paneEl);
  const es = new EventSource('/history-stream?s=' + encodeURIComponent(sess) + '&delta=1&net=' + encodeURIComponent(netMode));
  st.es = es;
  st.esSess = sess;
  st.esNetMode = netMode;
  st.lastStreamActivityAt = Date.now();
  st.statusEl.textContent = '连接中';
  const queueStreamData = nextData => {
    st.lastStreamActivityAt = Date.now();
    st.statusEl.textContent = '已连接';
    st.streamRevision = (st.streamRevision || 0) + 1;
    st.streamSnapshot = nextData;
    st.nextStreamData = nextData;
    if (!st.streamFrame) st.streamFrame = requestAnimationFrame(() => {
      st.streamFrame = 0;
      const latest = st.nextStreamData;
      st.nextStreamData = null;
      if (latest && st.es === es && isOpenHistOverlay(paneEl, st)) applyHistData(paneEl, {...latest}, !st.data, !!st.data);
    });
  };
  es.addEventListener('open', () => {
    if (st.es !== es) return;
    st.streamSnapshot = null;
    st.lastStreamActivityAt = Date.now();
    st.statusEl.textContent = '已连接';
  });
  es.addEventListener('heartbeat', () => {
    if (st.es === es) st.lastStreamActivityAt = Date.now();
  });
  es.addEventListener('error', () => { if (st.es === es) st.statusEl.textContent = '正在重连'; });
  es.addEventListener('err', () => { if (st.es === es) st.statusEl.textContent = '会话不可用'; });
  es.addEventListener('hist', e => {
    if (st.es !== es || isWebtermPaused()) return;
    if (!isOpenHistOverlay(paneEl, st)) { closeHistStream(paneEl); return; }
    try {
      queueStreamData(JSON.parse(e.data));
    } catch (err) {}
  });
  es.addEventListener('hist-tail', e => {
    if (st.es !== es || isWebtermPaused()) return;
    if (!isOpenHistOverlay(paneEl, st)) { closeHistStream(paneEl); return; }
    try {
      const delta = JSON.parse(e.data);
      const base = st.streamSnapshot;
      if (base?.digest && delta.baseDigest === base.digest && delta.digest &&
          delta.turnCount > 0 && base.turns?.length === delta.turnCount && delta.turn) {
        const {baseDigest, turnCount, turn, ...fields} = delta;
        queueStreamData({...base, ...fields, turns: [...base.turns.slice(0, -1), turn]});
        return;
      }
    } catch (err) {}
    // A fresh connection always starts with a full snapshot.
    closeHistStream(paneEl);
    openHistStream(paneEl);
  });
}

function syncHistStreams(){
  const timeoutMs = wtNet.streamTimeoutMs();
  for (const el of paneEls.values()) {
    const st = paneHistState.get(el);
    if (!st) continue;
    const shouldStream = !isWebtermPaused() && el.isConnected && el.classList.contains('on') && st.root.classList.contains('open');
    if (!shouldStream) {
      closeHistStream(el);
      continue;
    }
    if (st.es && Date.now() - st.lastStreamActivityAt >= timeoutMs) {
      closeHistStream(el);
      refreshHistPane(el, false, true);
    }
    openHistStream(el);
  }
}

function openHistoryOverlay(paneEl = getFocusedPaneEl(), recordOpen = true, reason = 'manual'){
  if (!paneEl) return;
  const sess = paneEl.dataset.sess;
  if (recordOpen && sess) {
    const openSet = readSessSet(HIST_OPEN_KEY); openSet.add(sess); writeSessSet(HIST_OPEN_KEY, openSet);
    const disSet = readSessSet(HIST_DISMISSED_KEY); disSet.delete(sess); writeSessSet(HIST_DISMISSED_KEY, disSet);
  }
  const st = ensureHistOverlay(paneEl);
  st.openedForAgent = reason === 'auto';
  st.shellIdleTicks = 0;
  const firstOpen = !st.data;
  st.root.classList.add('open');
  paneEl.classList.add('hist-active');
  syncHistBtnState();
  refreshHistPane(paneEl, firstOpen, false);
  openHistStream(paneEl);
  if (reason === 'manual' && !matchMedia('(pointer:coarse)').matches) st.inputEl.focus({ preventScroll: true });
}

function closeHistoryOverlay(paneEl = getFocusedPaneEl(), force = false){
  if (!paneEl || (FOLD_ONLY_PUBLIC && !force)) return;
  const sess = paneEl.dataset.sess;
  if (sess && !force) {
    const openSet = readSessSet(HIST_OPEN_KEY); openSet.delete(sess); writeSessSet(HIST_OPEN_KEY, openSet);
    const disSet = readSessSet(HIST_DISMISSED_KEY); disSet.add(sess); writeSessSet(HIST_DISMISSED_KEY, disSet);
  }
  closeHistStream(paneEl);
  const st = paneHistState.get(paneEl);
  if (st) {
    st.refreshId = (st.refreshId || 0) + 1;
    st.screenRevision = (st.screenRevision || 0) + 1;
    st.pendingData = null;
    st.root.classList.remove('open');
    st.selPopEl.classList.remove('open');
    st.shellIdleTicks = 0;
    st.openedForAgent = false;
  }
  paneEl.classList.remove('hist-active');
  if (paneEl.querySelector('iframe')?.dataset.resumeOnReveal === '1') updateTerminalConnection(paneEl);
  syncHistBtnState();
  if (paneEl === getFocusedPaneEl()) focusActive();
}

function toggleHistoryOverlay(paneEl = getFocusedPaneEl()){
  if (!paneEl || FOLD_ONLY_PUBLIC) return;
  const st = paneHistState.get(paneEl);
  if (st && st.root.classList.contains('open')) closeHistoryOverlay(paneEl);
  else openHistoryOverlay(paneEl, true, 'manual');
}

const AUTO_FOLD_AGENTS = ['agy', 'codex', 'claude', 'opencode', 'hermes', 'kimi', 'gemini', 'aider', 'goose', 'qwen', 'amp', 'droid'];
const SHELL_CMDS = new Set(['fish', 'bash', 'zsh', 'sh', 'dash', 'tcsh', 'csh']);

function isShellCmdName(cmd){
  return SHELL_CMDS.has(String(cmd || '').trim().toLowerCase());
}

function isAgentCmdName(cmd){
  const c = String(cmd || '').trim().toLowerCase();
  if (!c) return false;
  return AUTO_FOLD_AGENTS.some(a => c === a || c.startsWith(a + '-') || c.startsWith(a + '.'));
}

async function checkAutoFoldNow(paneEl){
  const sess = paneEl && paneEl.dataset && paneEl.dataset.sess;
  if (!sess || !paneEl.classList.contains('on')) return;
  if (!FOLD_ONLY_PUBLIC) {
    const openSet = readSessSet(HIST_OPEN_KEY);
    if (openSet.has(sess)) {
      const cur = paneHistState.get(paneEl);
      if (!cur || !cur.root.classList.contains('open')) openHistoryOverlay(paneEl, false, 'restore');
      return;
    }
    const disSet = readSessSet(HIST_DISMISSED_KEY);
    if (disSet.has(sess)) return;
  }
  const cur = paneHistState.get(paneEl);
  if (cur && cur.root.classList.contains('open')) return;
  if (paneEl.dataset.autoFoldChecking === '1') return;
  paneEl.dataset.autoFoldChecking = '1';
  try {
    const r = await fetch('/history?s=' + encodeURIComponent(sess) + '&probe=1', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
    if (!r.ok) return;
    const d = await r.json();
    if (d.pending) return;
    if (!paneEl.isConnected || !paneEl.classList.contains('on') || paneEl.dataset.sess !== sess) return;
    if (!FOLD_ONLY_PUBLIC && readSessSet(HIST_DISMISSED_KEY).has(sess)) return;
    const nowCur = paneHistState.get(paneEl);
    if (nowCur && nowCur.root.classList.contains('open')) return;
    const activeNow = Boolean(d.runningAgent || isAgentCmdName(d.cmd) || (d.agent && !isShellCmdName(d.cmd)));
    if (activeNow) {
      openHistoryOverlay(paneEl, false, 'auto');
    }
  } catch (e) {
  } finally {
    delete paneEl.dataset.autoFoldChecking;
  }
}

let foldRequest = null;
function pollActiveAgentFold(){
  if (foldRequest) return foldRequest;
  foldRequest = fetchActiveAgentFold().finally(() => { foldRequest = null; });
  return foldRequest;
}
async function fetchActiveAgentFold(){
  if (isWebtermPaused()) return;
  const toOpen = [];
  const toWatchExit = [];
  const isVisiblePane = (el, sess) => !isWebtermPaused() &&
    el.isConnected && el.classList.contains('on') && el.dataset.sess === sess;
  const disSet = FOLD_ONLY_PUBLIC ? new Set() : readSessSet(HIST_DISMISSED_KEY);
  for (const el of paneEls.values()) {
    if (!el.isConnected || !el.classList.contains('on')) continue;
    const sess = el.dataset && el.dataset.sess;
    if (!sess) continue;
    const st = paneHistState.get(el);
    if (st && st.root.classList.contains('open')) {
      if (st.openedForAgent) toWatchExit.push({el, sess, st});
      continue;
    }
    if (disSet.has(sess)) continue;
    toOpen.push({el, sess});
  }
  if (!toOpen.length && !toWatchExit.length) return;
  try {
    const r = await fetch('/session-cmds', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
    if (!r.ok) return;
    const j = await r.json();
    const cmds = (j && j.cmds) || {};
    const agents = (j && j.agents) || {};
    for (const {el, sess} of toOpen) {
      if (!isVisiblePane(el, sess) || isOpenHistOverlay(el, paneHistState.get(el))) continue;
      if (!FOLD_ONLY_PUBLIC && readSessSet(HIST_DISMISSED_KEY).has(sess)) continue;
      if (agents[sess] || isAgentCmdName(cmds[sess])) {
        openHistoryOverlay(el, false, 'auto');
      }
    }
    for (const {el, sess, st} of toWatchExit) {
      if (!isVisiblePane(el, sess) || !isOpenHistOverlay(el, st) || !st.openedForAgent) continue;
      if (isShellCmdName(cmds[sess]) && !agents[sess]) {
        st.shellIdleTicks = (st.shellIdleTicks || 0) + 1;
        if (st.shellIdleTicks >= 3) {
          closeHistoryOverlay(el, true);
        }
      } else {
        st.shellIdleTicks = 0;
      }
    }
  } catch (e) {}
}

function suspendWebterm(){
  backgroundSince ??= Date.now();
  clearTimeout(resumeTimer);
  resumeTimer = 0;
  syncHistStreams();
  for (const el of paneEls.values()) {
    const st = paneHistState.get(el);
    if (st) saveHistDraft(st);
  }
}

function scheduleWebtermResume(){
  if (isWebtermPaused() || resumeTimer) return;
  // Browsers can dispatch focus, pageshow and visibilitychange for the same return.
  resumeTimer = setTimeout(() => {
    resumeTimer = 0;
    if (isWebtermPaused()) return;
    const wasSuspended = backgroundSince !== null;
    const longPause = wasSuspended && Date.now() - backgroundSince >= 60000;
    backgroundSince = null;
    syncHistStreams();
    for (const pane of paneEls.values()) {
      if (!pane.classList.contains('on')) continue;
      updateTerminalConnection(pane, true, longPause);
      const st = paneHistState.get(pane);
      if (isOpenHistOverlay(pane, st)) {
        if (wasSuspended) refreshHistPane(pane, false, true);
        st.nextScreenStatusAt = 0;
        st.refreshLive();
      }
    }
    pollActiveAgentFold();
  }, 180);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) suspendWebterm();
  else scheduleWebtermResume();
});
window.addEventListener('pagehide', () => {
  pageSuspended = true;
  suspendWebterm();
});
window.addEventListener('pageshow', () => {
  pageSuspended = false;
  scheduleWebtermResume();
});
window.addEventListener('focus', scheduleWebtermResume);
window.addEventListener('offline', suspendWebterm);
window.addEventListener('online', scheduleWebtermResume);
setInterval(syncHistStreams, 2000);
(function scheduleFoldPoll(){
  setTimeout(async () => {
    try { await pollActiveAgentFold(); } finally { scheduleFoldPoll(); }
  }, wtNet.foldPollMs());
})();

// Follow the visual viewport so the compose box stays above a mobile keyboard.
const iosViewport = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (window.visualViewport) {
  const viewport = window.visualViewport;
  const app = document.getElementById('app');
  let viewportFrame = 0;
  let viewportSettleTimer = 0;
  const fitViewport = () => {
    const {height, offsetTop, scale} = viewport;
    if (document.hidden || height <= 0 || (scale && Math.abs(scale - 1) > .02)) return;
    app.style.height = height + 'px';
    app.style.top = offsetTop + 'px';
    document.documentElement.style.setProperty('--wt-viewport-height', height + 'px');
    document.documentElement.classList.toggle('kb-open', window.innerHeight - height > 120);
  };
  const queueViewportFit = () => {
    if (viewportFrame || document.hidden) return;
    viewportFrame = requestAnimationFrame(() => {
      viewportFrame = 0;
      fitViewport();
    });
  };
  const recoverViewport = () => {
    clearTimeout(viewportSettleTimer);
    if (document.hidden) return;
    queueViewportFit();
    // iOS Safari can publish the final keyboard or toolbar geometry after pageshow.
    if (iosViewport) viewportSettleTimer = setTimeout(queueViewportFit, 400);
  };
  viewport.addEventListener('resize', queueViewportFit);
  viewport.addEventListener('scroll', queueViewportFit);
  window.addEventListener('resize', queueViewportFit);
  window.addEventListener('pageshow', recoverViewport);
  document.addEventListener('visibilitychange', recoverViewport);
  if (iosViewport) {
    window.addEventListener('focus', recoverViewport);
    window.addEventListener('orientationchange', recoverViewport);
  }
  fitViewport();
}

(function setupMobileKeybar(){
  const bar = document.getElementById('mobile-keybar');
  if (!bar) return;
  const SEQ = {
    up: '\x1b[A',
    down: '\x1b[B',
    left: '\x1b[D',
    right: '\x1b[C',
    tab: '\t',
    esc: '\x1b',
    enter: '\r',
    ctrlc: '\x03'
  };
  const REPEATABLE = new Set(['up', 'down', 'left', 'right']);
  let hold = null;
  const focusedTarget = () => {
    const pane = getFocusedPaneEl() || [...paneEls.values()].find(p => p.classList.contains('on'));
    return pane?.classList.contains('hist-active') ? null : pane;
  };

  function stopRepeat(event){
    if (!hold || (event?.pointerId != null && event.pointerId !== hold.pointerId)) return;
    clearTimeout(hold.timer);
    hold.button.classList.remove('pressed');
    hold = null;
  }

  async function fireKey(target, keyName){
    if (!target) return false;
    const sent = await sendRawToPane(target, SEQ[keyName]);
    if (!sent) {
      toast('发送结果未确认，请查看终端后再操作');
      return false;
    }
    return true;
  }

  async function sendHeldKey(press, delay){
    if (hold !== press || press.target !== focusedTarget()) {
      if (hold === press) stopRepeat();
      return;
    }
    const started = performance.now();
    const sent = await fireKey(press.target, press.keyName);
    if (hold !== press) return;
    if (sent && REPEATABLE.has(press.keyName)) {
      press.timer = setTimeout(() => sendHeldKey(press, 80), Math.max(0, delay - (performance.now() - started)));
    } else if (!sent) {
      stopRepeat();
    }
  }

  bar.addEventListener('pointerdown', e => {
    const button = e.target.closest('button[data-mkey]');
    if (!button || !e.isPrimary || e.button !== 0) return;
    e.preventDefault();
    stopRepeat();
    const target = focusedTarget();
    if (!target) return;
    const press = { button, target, pointerId: e.pointerId, keyName: button.dataset.mkey, timer: null };
    hold = press;
    button.classList.add('pressed');
    try { button.setPointerCapture(e.pointerId); } catch (_) {}
    sendHeldKey(press, 360);
  });
  window.addEventListener('pointerup', stopRepeat);
  window.addEventListener('pointercancel', stopRepeat);
  bar.addEventListener('lostpointercapture', stopRepeat);
  bar.addEventListener('contextmenu', e => e.preventDefault());
  bar.addEventListener('click', e => {
    if (e.detail !== 0) return;
    const button = e.target.closest('button[data-mkey]');
    if (button) fireKey(focusedTarget(), button.dataset.mkey);
  });
  window.addEventListener('blur', stopRepeat);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopRepeat(); });
})();

/* 事件绑定与初始化 */
window.addEventListener('keydown', navKey, true);
if (histBtn) histBtn.onclick = () => toggleHistoryOverlay();
document.getElementById('add').onclick = () => newTab();
document.getElementById('split-h').onclick = () => splitPane('h');
document.getElementById('split-v').onclick = () => splitPane('v');
closePaneBtn.onclick = () => closeActivePane();
mobilePaneSelect.onchange = () => {
  if (!active || !findLeaf(active.root, mobilePaneSelect.value)) return;
  active.activePaneId = mobilePaneSelect.value;
  render();
};
singlePaneMedia.addEventListener('change', render);

const canReadClipboard = !!(navigator.clipboard && navigator.clipboard.read);
if (canReadClipboard) document.getElementById('paste').onclick = pasteFromClipboard;
else document.getElementById('paste').style.display = 'none';

const uploadBtnEl = document.getElementById('upload-btn');
const filePickerEl = document.getElementById('file-picker');
if (uploadBtnEl) uploadBtnEl.onclick = () => openFilePickerForPane();
if (filePickerEl) filePickerEl.addEventListener('change', async e => {
  const files = e.target.files ? [...e.target.files] : [];
  if (files.length) await uploadFiles(files, pickerTargetPane);
  pickerTargetPane = null;
  e.target.value = '';
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && (e.key === 'V' || e.key === 'v')) {
    e.preventDefault();
    canReadClipboard ? pasteFromClipboard() : toast('直接点进终端按 ⌘V 粘贴图片即可');
  }
  if (e.ctrlKey && e.code === 'KeyT') { e.preventDefault(); newTab(); }
  if (e.ctrlKey && e.code === 'KeyW' && active) { e.preventDefault(); closeTab(active); }
});

if (!restoreState()) newTab();
if (FOLD_ONLY_PUBLIC) setTimeout(() => { if (!document.hidden) loadSys(); }, 1200);
else loadSys();
(function scheduleSysPoll(){
  setTimeout(async () => {
    try { if (!document.hidden) await loadSys(); } finally { scheduleSysPoll(); }
  }, wtNet.sysMs());
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadSys(); });

(function setupWallpaper(){
  const WALL_KEY = 'wt_wallpaper_v2';
  const FIXED_WALL = 'anime_car_sunset.webp';
  const el = document.getElementById('bg-wall');
  const blurEl = document.getElementById('bg-wall-blur');
  const btn = document.getElementById('wall-btn');
  const exitBtn = document.getElementById('wall-exit');
  if (!el || !btn) return;
  const lbl = btn.querySelector('.lbl');
  let cur = FIXED_WALL;
  let wallApplied = false;
  try { localStorage.setItem(WALL_KEY, FIXED_WALL); } catch (e) {}

  function applyWallUrl(name){
    if (wallApplied) return;
    wallApplied = true;
    const val = 'url("/wallpaper/' + encodeURIComponent(name) + '")';
    el.style.backgroundImage = val;
    if (blurEl) blurEl.style.backgroundImage = val;
    el.classList.remove('off');
  }

  if (FOLD_ONLY_PUBLIC) {
    // Defer decorative wallpaper fetch on public links until conversation loads.
    setTimeout(() => { if (!document.hidden) applyWallUrl(cur); }, 2600);
  } else {
    applyWallUrl(cur);
  }

  function setPeek(on){
    const next = typeof on === 'boolean' ? on : !document.body.classList.contains('wall-peek');
    if (next) applyWallUrl(cur);
    document.body.classList.toggle('wall-peek', next);
    btn.setAttribute('aria-pressed', String(next));
    if (lbl) lbl.textContent = next ? '回终端' : '看壁纸';
    if (next) {
      qPop.classList.remove('open');
      qPill.classList.remove('open');
    } else {
      focusActive();
    }
  }

  btn.onclick = () => setPeek();
  const exitPeek = () => {
    if (document.body.classList.contains('wall-peek')) setPeek(false);
  };
  el.addEventListener('click', exitPeek);
  if (exitBtn) exitBtn.addEventListener('click', exitPeek);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('wall-peek')) {
      e.preventDefault();
      e.stopPropagation();
      setPeek(false);
    }
  }, true);
})();

(function setupHotReload(){
  const m = document.querySelector('meta[name="wt-ver"]');
  const pageVer = m ? m.content : '';
  if (!pageVer || !window.EventSource) return;
  let reloading = false;
  const es = new EventSource('/events');
  es.onmessage = e => {
    if (!reloading && e.data && e.data !== pageVer) {
      reloading = true;
      saveState();
      for (const el of paneEls.values()) { const st = paneHistState.get(el); if (st) saveHistDraft(st); }
      toast('工作台有更新，刷新后生效；草稿已保留');
    }
  };
})();
